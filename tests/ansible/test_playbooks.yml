- name: Validate Flask upload webserver setup
  hosts: localhost
  become: yes
  tasks:
    - name: Check Flask app script exists
      stat:
        path: /opt/data_pipeline/flask_server.py
      register: flask_script

    - name: Assert Flask script is present
      assert:
        that:
          - flask_script.stat.exists

    - name: Check if Flask service is running
      systemd:
        name: flask_upload_ui
      register: flask_service

    - name: Assert Flask upload UI is active
      assert:
        that:
          - flask_service.status.ActiveState == "active"

- name: Validate React frontend deployment
  hosts: localhost
  become: yes
  tasks:
    - name: Check Apache web root has React build
      stat:
        path: /var/www/html/index.html
      register: react_index

    - name: Assert React build was copied
      assert:
        that:
          - react_index.stat.exists

- name: Validate dataset download and chunk split
  hosts: worker1
  become: yes
  tasks:
    - name: Check if dataset file was downloaded
      stat:
        path: /data/uniref50.fasta
      register: fasta_file

    - name: Assert FASTA file exists
      assert:
        that:
          - fasta_file.stat.exists

    - name: Check if compressed chunks exist
      find:
        paths: /data/chunks
        patterns: "chunk_*.fasta.gz"
      register: chunks

    - name: Assert chunks were generated and compressed
      assert:
        that:
          - chunks.matched > 0


- name: Validate Prometheus and Grafana setup
  hosts: localhost
  become: yes
  tasks:
    - name: Check if Prometheus is running
      systemd:
        name: prometheus
      register: prom_service

    - name: Assert Prometheus is active
      assert:
        that:
          - prom_service.status.ActiveState == "active"

    - name: Check if Grafana is running
      systemd:
        name: grafana-server
      register: grafana_service

    - name: Assert Grafana is active
      assert:
        that:
          - grafana_service.status.ActiveState == "active"

- name: Validate Node Exporter on workers
  hosts: worker_inventory
  become: yes
  tasks:
    - name: Check if Node Exporter is running
      systemd:
        name: node_exporter
      register: node_exporter_status

    - name: Assert Node Exporter is active
      assert:
        that:
          - node_exporter_status.status.ActiveState == "active"

- name: Validate controller.py is deployed and running
  hosts: localhost
  become: yes
  tasks:
    - name: Check controller script exists
      stat:
        path: /home/almalinux/esm_pipeline/controller.py
      register: controller_script

    - name: Assert controller script is present
      assert:
        that:
          - controller_script.stat.exists

    - name: Check controller log exists
      stat:
        path: /mnt/data_volume/results/controller_submit_log.txt
      register: controller_log

    - name: Assert controller log file exists
      assert:
        that:
          - controller_log.stat.exists