- name: Set Management Node Hostname (mgmtnode)
  hosts: localhost
  become: true
  become_user: root
  tasks:
    - name: Set hostname for management node to "mgmtnode"
      ansible.builtin.hostname:
        name: mgmtnode
        use: systemd

- name: Set Worker Node Hostnames
  hosts: worker_inventory
  become: true
  become_user: root
  tasks:
    - name: Set hostname for worker nodes
      ansible.builtin.hostname:
        name: "workernode{{ groups['worker_inventory'].index(inventory_hostname) + 1 }}"
        use: systemd

- name: Set mgmt IP and configure /etc/hosts across all nodes
  hosts: all, localhost
  become: true
  tasks:
    - name: Get external IP of mgmt node (localhost)
      ansible.builtin.set_fact:
        mgmt_ip: "{{ lookup('pipe', \"hostname -I | awk '{print $1}'\") }}"
      run_once: true
      delegate_to: localhost

    - name: Deploy /etc/hosts template
      ansible.builtin.template:
        src: templates/hosts.j2
        dest: /etc/hosts
        owner: root
        group: root
        mode: '0644'



