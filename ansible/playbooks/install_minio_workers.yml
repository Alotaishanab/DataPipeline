---
- name: Install and Configure Distributed MinIO on Workers
  hosts: worker_inventory
  become: yes

  vars:
    minio_root_user: "admin"
    minio_root_password: "Min10S3P@ss"  # Replace with a secure password
    minio_server_datadirs:
      - "/mnt/data"
    # Avoid extra system packages (avoids EPEL conflicts)
    minio_install_pip: false
    # Instruct the role to install server and client but skip built-in alias configuration
    minio_install_server: true
    minio_install_client: true
    minio_configure_client: false

    # Default port for MinIO (we want it on 9090)
    minio_default_port: "9090"

  pre_tasks:
    - name: Build MINIO_VOLUMES endpoints list
      set_fact:
        minio_volumes_list: >-
          {% set eps = [] %}
          {% for host in groups['worker_inventory'] %}
            {% set hostname = hostvars[host]['tag.harvesterhci.io/minio_ingress_hostname'] 
               | default(hostvars[host].ansible_host) | trim %}
            {% set port = hostvars[host]['tag.harvesterhci.io/minio_ingress_port'] 
               | default(minio_default_port) | trim %}
            {% set _ = eps.append("http://{}:{}/mnt/data".format(hostname, port)) %}
          {% endfor %}
          {{ eps }}
    - name: Set MINIO_VOLUMES as a clean space-separated string
      set_fact:
        minio_volumes: "{{ minio_volumes_list | join(' ') | regex_replace('\\s+', ' ') | trim | string }}"
    - name: Debug MINIO_VOLUMES
      debug:
        msg: "MINIO_VOLUMES: {{ minio_volumes }}"

    - name: Ensure EPEL repository is installed on AlmaLinux workers
      dnf:
        name: epel-release
        state: present

  tasks:
    - name: Pre-install virtualenv using pip on worker nodes
      pip:
        name: virtualenv
      become: yes

    - name: Install wheel via pip (fallback for python3-wheel)
      pip:
        name: wheel
      become: yes

    - name: Dynamically include the ricsanfre.minio role
      include_role:
        name: ricsanfre.minio

  post_tasks:
    - name: Override MINIO_VOLUMES in /etc/minio/minio.conf with proper endpoints
      lineinfile:
        path: /etc/minio/minio.conf
        regexp: '^MINIO_VOLUMES='
        line: "MINIO_VOLUMES={{ minio_volumes }}"
      notify:
        - restart minio

    - name: Override MINIO_OPTS in /etc/minio/minio.conf to force port {{ minio_default_port }}
      lineinfile:
        path: /etc/minio/minio.conf
        regexp: '^MINIO_OPTS='
        line: "MINIO_OPTS=\"--address :{{ minio_default_port }} /mnt/data\""
      notify:
        - restart minio

    - name: (Optional) Debug /etc/minio/minio.conf content
      command: cat /etc/minio/minio.conf
      register: minio_conf_content
      changed_when: false

    - debug:
        msg: "MinIO config file content: {{ minio_conf_content.stdout }}"

    - name: Wait for MinIO to start listening on port {{ minio_default_port }}
      wait_for:
        host: 127.0.0.1
        port: "{{ minio_default_port }}"
        timeout: 30
      delegate_to: "{{ inventory_hostname }}"

    - name: Configure MinIO alias on port {{ minio_default_port }}
      shell: /usr/local/bin/mc alias set myminio http://127.0.0.1:{{ minio_default_port }} "{{ minio_root_user }}" "{{ minio_root_password }}"
      register: mc_alias_result
      changed_when: mc_alias_result.rc == 0
      failed_when: mc_alias_result.rc not in [0]

  handlers:
    - name: restart minio
      service:
        name: minio
        state: restarted
