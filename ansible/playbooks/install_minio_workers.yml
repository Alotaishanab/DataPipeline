---
- name: Install and Configure Distributed MinIO on Workers
  hosts: worker_inventory
  become: yes

  vars:
    minio_root_user: "admin"
    minio_root_password: "Min10S3P@ss"  # Replace with your secure password
    minio_server_datadirs:
      - "/mnt/data"
    minio_install_pip: false
    minio_install_server: true
    minio_install_client: false
    minio_configure_client: false
    minio_default_port: "9090"

  # ----- 1) Pre-Tasks -----
  pre_tasks:
    - name: Remove leftover /etc/minio/minio.conf or old env file
      file:
        path: /etc/minio/minio.conf
        state: absent
      ignore_errors: true

    - name: Debug info about removed file
      debug:
        msg: "Removed old /etc/minio/minio.conf to remove any \\1 references."

    - name: Build MINIO_VOLUMES endpoints from worker IPs
      set_fact:
        minio_volumes: >
          {% set eps = [] %}
          {% for host in groups['worker_inventory'] %}
            {% set ip = hostvars[host].ansible_host %}
            {% set _ = eps.append("http://" ~ ip ~ ":" ~ minio_default_port ~ "/mnt/data") %}
          {% endfor %}
          {{ eps | join(" ") | trim }}

    - name: Debug MINIO_VOLUMES
      debug:
        msg: "MINIO_VOLUMES: {{ minio_volumes }}"

    - name: Ensure EPEL repository is installed on AlmaLinux workers
      dnf:
        name: epel-release
        state: present

  # ----- 2) Main Role + Overwrite Tasks -----
  tasks:
    - name: Pre-install virtualenv using pip on worker nodes
      pip:
        name: virtualenv
      become: yes

    - name: Install wheel via pip (fallback for python3-wheel)
      pip:
        name: wheel
      become: yes

    - name: Include the ricsanfre.minio role (server installation)
      include_role:
        name: ricsanfre.minio

  # ----- 3) Post-Tasks: Deploy Our Custom Config -----
  post_tasks:
    - name: Deploy custom MinIO configuration file using template
      template:
        src: "../templates/minio.conf.j2"
        dest: "/etc/minio/minio.conf"
      notify:
        - restart minio

    - name: Debug /etc/minio/minio.conf content after override
      command: cat /etc/minio/minio.conf
      register: minio_conf_content
      changed_when: false

    - debug:
        msg: "MinIO config file content: {{ minio_conf_content.stdout }}"

    - name: Reload systemd daemon
      command: systemctl daemon-reload
      become: yes

    - name: Restart MinIO
      service:
        name: minio
        state: restarted
      become: yes

    - name: Wait for MinIO to start listening on port {{ minio_default_port }}
      wait_for:
        host: 127.0.0.1
        port: "{{ minio_default_port }}"
        timeout: 30
      delegate_to: "{{ inventory_hostname }}"

    - name: Configure MinIO alias on port {{ minio_default_port }}
      shell: "/usr/local/bin/mc alias set myminio http://127.0.0.1:{{ minio_default_port }} {{ minio_root_user }} {{ minio_root_password }}"
      register: mc_alias_result
      changed_when: mc_alias_result.rc == 0
      failed_when: mc_alias_result.rc not in [0]

  handlers:
    - name: restart minio
      service:
        name: minio
        state: restarted