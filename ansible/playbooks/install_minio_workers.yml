- name: Install and Configure Distributed MinIO on Workers
  hosts: worker_inventory
  become: yes
  vars:
    clean_minio_data: true           # Set to true for a fresh deployment (wipe /mnt/data)
    minio_root_user: "admin"
    minio_root_password: "Min10S3P@ss"
    minio_default_port: "9090"
    # Role overrides:
    minio_install_pip: false
    minio_server_datadirs:
      - "/mnt/data"
    minio_install_server: true
    minio_install_client: false
    minio_configure_client: false

  pre_tasks:
    - name: Clean /mnt/data directory completely
      shell: "find /mnt/data -mindepth 1 -delete"
      when: clean_minio_data | bool
      ignore_errors: true

    - name: Remove leftover /etc/minio/minio.conf or old env file
      file:
        path: /etc/minio/minio.conf
        state: absent
      ignore_errors: true

    - name: Debug info about removed file
      debug:
        msg: "Removed old /etc/minio/minio.conf if it existed."

    - name: Build MINIO_VOLUMES endpoints from worker IPs (without port)
      set_fact:
        minio_volumes: >
          {% set eps = [] %}
          {% for host in groups['worker_inventory'] %}
            {% set ip = hostvars[host].ansible_host %}
            {% set _ = eps.append("http://" ~ ip ~ "/mnt/data") %}
          {% endfor %}
          {{ eps | join(" ") | trim }}

    - name: Show final MINIO_VOLUMES
      debug:
        msg: "MINIO_VOLUMES: {{ minio_volumes }}"

    - name: Ensure EPEL repository is installed on AlmaLinux workers
      dnf:
        name: epel-release
        state: present

  tasks:
    - name: Pre-install virtualenv using pip on worker nodes
      pip:
        name: virtualenv

    - name: Install wheel via pip (fallback for python3-wheel)
      pip:
        name: wheel

    - name: Include the ricsanfre.minio role (server installation)
      include_role:
        name: ricsanfre.minio
      vars:
        minio_install_pip: false
        minio_server_datadirs: ["/mnt/data"]

  post_tasks:
    - name: Deploy custom MinIO configuration file using template
      template:
        src: "../templates/minio.conf.j2"
        dest: "/etc/minio/minio.conf"
      notify:
        - restart minio

    - name: Reload systemd daemon
      command: systemctl daemon-reload
      become: yes

    - name: Wait for MinIO to start listening on port {{ minio_default_port }}
      wait_for:
        host: "{{ ansible_host }}"
        port: "{{ minio_default_port }}"
        timeout: 180
      delegate_to: "{{ inventory_hostname }}"

  handlers:
    - name: restart minio
      service:
        name: minio
        state: restarted


- name: Install MinIO Client (mc) on all Workers
  hosts: worker_inventory
  become: yes
  vars:
    minio_default_port: "9090"
    minio_root_user: "admin"
    minio_root_password: "Min10S3P@ss"
  tasks:
    - name: Download and install mc binary
      get_url:
        url: "https://dl.min.io/client/mc/release/linux-amd64/mc"
        dest: "/usr/local/bin/mc"
        mode: '0755'

- name: Configure MinIO alias on all Workers
  hosts: worker_inventory
  become: yes
  vars:
    minio_default_port: "9090"
    minio_root_user: "admin"
    minio_root_password: "Min10S3P@ss"
  tasks:
    - name: Configure MinIO alias on port "{{ minio_default_port }}"
      shell: >
        /usr/local/bin/mc alias set myminio http://{{ ansible_host }}:{{ minio_default_port }} {{ minio_root_user }} {{ minio_root_password }}
      register: mc_alias_result
      changed_when: mc_alias_result.rc == 0
      failed_when: mc_alias_result.rc not in [0]
