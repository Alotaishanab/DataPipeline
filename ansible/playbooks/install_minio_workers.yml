- name: Install and Configure Distributed MinIO on Workers
  hosts: worker_inventory
  become: true

  vars:
    minio_root_user: "admin"
    minio_root_password: "Min10S3P@ss"  # Replace with a secure password
    minio_server_datadirs:
      - "/mnt/data"
    # Prevent ricsanfre.minio from installing pip/system pkgs (EPEL conflict)
    minio_install_pip: false

    # Tells ricsanfre.minio to install server & client but skip the built-in alias config
    minio_install_server: true
    minio_install_client: true
    minio_configure_client: false

  pre_tasks:
    - name: Build MinIO cluster endpoints from inventory
      set_fact:
        minio_server_cluster_nodes: >-
          {{ groups['worker_inventory']
             | map('extract', hostvars, 'ansible_host')
             | map('regex_replace', '^(.*)$', 'http://\\1:9090/mnt/data')
             | list }}

    - name: Ensure EPEL repository is installed on AlmaLinux workers
      dnf:
        name: epel-release
        state: present

  tasks:
    - name: Pre-install virtualenv using pip on worker nodes
      pip:
        name: virtualenv
      become: yes

    - name: Install wheel via pip (fallback for python3-wheel)
      pip:
        name: wheel
      become: yes

    - name: Dynamically include the ricsanfre.minio role
      include_role:
        name: ricsanfre.minio

  post_tasks:
    #######################################################################
    # 1) Force /etc/minio/minio.conf to specify :9090 so MinIO actually listens
    #######################################################################
    - name: Override MINIO_OPTS in /etc/minio/minio.conf
      lineinfile:
        path: /etc/minio/minio.conf
        regexp: '^MINIO_OPTS='
        line: 'MINIO_OPTS="--address :9090 /mnt/data"'
      notify:
        - restart minio

    #######################################################################
    # 2) Wait for MinIO to start on port 9090
    #######################################################################
    - name: Wait for MinIO to start listening on 9090
      wait_for:
        host: 127.0.0.1
        port: 9090
        timeout: 30
      delegate_to: "{{ inventory_hostname }}"

    #######################################################################
    # 3) Manually set MinIO alias
    #######################################################################
    - name: Configure MinIO alias on port 9090
      shell: >
        /usr/local/bin/mc alias set myminio
        http://127.0.0.1:9090
        "{{ minio_root_user }}"
        "{{ minio_root_password }}"
      register: mc_alias_result
      changed_when: mc_alias_result.rc == 0
      failed_when: mc_alias_result.rc not in [0]

  handlers:
    - name: restart minio
      service:
        name: minio
        state: restarted
