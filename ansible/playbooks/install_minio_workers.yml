- name: Install and Configure Distributed MinIO on Workers
  hosts: worker_inventory
  become: yes
  vars:
    clean_minio_data: true           # Set to true to wipe /mnt/data on fresh deployments
    minio_root_user: "admin"
    minio_root_password: "Min10S3P@ss"
    minio_default_port: "9090"       # Base port passed to MINIO_OPTS (–address :9090)
    # Role parameters for the included role:
    minio_install_pip: false
    minio_server_datadirs: ["/mnt/data"]
    minio_install_server: true
    minio_install_client: false
    minio_configure_client: false
    # (Optional) These variables still get built for logging purposes.
  pre_tasks:
    - name: Unmount /mnt/data if mounted (fresh deployment)
      mount:
        path: /mnt/data
        state: unmounted
      when: clean_minio_data | bool
      ignore_errors: true

    - name: Reformat /dev/vdb with XFS (fresh deployment)
      command: "mkfs.xfs -f /dev/vdb"
      when: clean_minio_data | bool
      ignore_errors: true

    - name: Mount /mnt/data on /dev/vdb
      mount:
        path: /mnt/data
        src: /dev/vdb
        fstype: xfs
        state: mounted
      when: clean_minio_data | bool

    - name: Clean /mnt/data directory completely (if fresh deployment)
      shell: "find /mnt/data -mindepth 1 -delete"
      when: clean_minio_data | bool
      ignore_errors: true

    - name: Remove MinIO metadata directory (.minio.sys) from /mnt/data (fresh deployment)
      file:
        path: /mnt/data/.minio.sys
        state: absent
      when: clean_minio_data | bool
      ignore_errors: true

    - name: Remove leftover /etc/minio/minio.conf
      file:
        path: /etc/minio/minio.conf
        state: absent
      ignore_errors: true

    - name: Debug info about removed MinIO conf file
      debug:
        msg: "Removed old /etc/minio/minio.conf if it existed."

    - name: Build MINIO_VOLUMES endpoints from worker IPs
      set_fact:
        minio_volumes: >
          {% set eps = [] %}
          {% for host in groups['worker_inventory'] %}
            {% set ip = hostvars[host].ansible_host %}
            {% set _ = eps.append("http://" ~ ip ~ ":" ~ minio_default_port ~ "/mnt/data") %}
          {% endfor %}
          {{ eps | join(" ") | trim }}

    - name: Show final MINIO_VOLUMES
      debug:
        msg: "MINIO_VOLUMES: {{ minio_volumes }}"

    - name: Ensure EPEL repository is installed on AlmaLinux workers
      dnf:
        name: epel-release
        state: present

  tasks:
    - name: Pre-install virtualenv using pip on worker nodes
      pip:
        name: virtualenv

    - name: Install wheel via pip (fallback for python3-wheel)
      pip:
        name: wheel

    - name: Include the ricsanfre.minio role (server installation)
      include_role:
        name: ricsanfre.minio

  post_tasks:
    - name: Deploy custom MinIO configuration file using template
      template:
        src: "../templates/minio.conf.j2"
        dest: "/etc/minio/minio.conf"
      notify:
        - restart minio

    - name: Reload systemd daemon
      command: systemctl daemon-reload
      become: yes

    - name: Restart MinIO service
      service:
        name: minio
        state: restarted
      become: yes

  handlers:
    - name: restart minio
      service:
        name: minio
        state: restarted

- name: Configure MinIO alias on the management host (using ingress labels)
  hosts: localhost
  become: yes
  vars:
    minio_ingress_hostname: "ucabbaa-minio"   # This is provided by your mgmt_vm_tags
    minio_ingress_port: "9090"
    minio_root_user: "admin"
    minio_root_password: "Min10S3P@ss"
  tasks:
    - name: Wait for MinIO to be accessible on the ingress endpoint
      wait_for:
        host: "{{ minio_ingress_hostname }}"
        port: "{{ minio_ingress_port }}"
        timeout: 60

    - name: Configure MinIO alias using mc
      shell: "/usr/local/bin/mc alias set myminio http://{{ minio_ingress_hostname }}:{{ minio_ingress_port }} {{ minio_root_user }} {{ minio_root_password }}"
      register: mc_alias_result
      changed_when: mc_alias_result.rc == 0
      failed_when: mc_alias_result.rc not in [0]

- name: Install MinIO Client (mc) on all Workers
  hosts: worker_inventory
  become: yes
  vars:
    minio_default_port: "9090"
    minio_root_user: "admin"
    minio_root_password: "Min10S3P@ss"
  tasks:
    - name: Download and install mc binary
      get_url:
        url: "https://dl.min.io/client/mc/release/linux-amd64/mc"
        dest: "/usr/local/bin/mc"
        mode: '0755'
