---
- name: Install and Configure Distributed MinIO on Workers
  hosts: worker_inventory
  become: yes

  vars:
    minio_root_user: "admin"
    minio_root_password: "Min10S3P@ss"  # Replace with a secure password
    minio_server_datadirs:
      - "/mnt/data"
    # Prevent the role from installing system pip packages (avoiding EPEL conflicts)
    minio_install_pip: false

    # Instruct the role to install the server and client but skip built-in alias configuration
    minio_install_server: true
    minio_install_client: true
    minio_configure_client: false

    # Desired port and URL (ensure consistency across tasks)
    minio_server_port: 9090
    minio_unsecure_url: "http://127.0.0.1:9090"

  pre_tasks:
    - name: Build MinIO cluster endpoints from inventory
      set_fact:
        minio_server_cluster_nodes: >-
          {{ groups['worker_inventory']
             | map('extract', hostvars, 'ansible_host')
             | map('regex_replace', '^(.*)$', 'http://\\1:9090/mnt/data')
             | list }}

    - name: Ensure EPEL repository is installed on AlmaLinux workers
      dnf:
        name: epel-release
        state: present

  tasks:
    - name: Pre-install virtualenv using pip on worker nodes
      pip:
        name: virtualenv
      become: yes

    - name: Install wheel via pip (fallback for python3-wheel)
      pip:
        name: wheel
      become: yes

    - name: Dynamically include the ricsanfre.minio role
      include_role:
        name: ricsanfre.minio

  post_tasks:
    - name: Override MINIO_OPTS in /etc/minio/minio.conf to force port 9090
      lineinfile:
        path: /etc/minio/minio.conf
        regexp: '^MINIO_OPTS='
        line: 'MINIO_OPTS="--address :9090 /mnt/data"'
      notify:
        - restart minio

    - name: (Optional) Debug /etc/minio/minio.conf content
      command: cat /etc/minio/minio.conf
      register: minio_conf_content
      changed_when: false

    - debug:
        msg: "MinIO config file content: {{ minio_conf_content.stdout }}"

    - name: Wait for MinIO to start listening on port 9090
      wait_for:
        host: 127.0.0.1
        port: 9090
        timeout: 30
      delegate_to: "{{ inventory_hostname }}"

    - name: Configure MinIO alias on port 9090
      shell: /usr/local/bin/mc alias set myminio {{ minio_unsecure_url }} "{{ minio_root_user }}" "{{ minio_root_password }}"
      register: mc_alias_result
      changed_when: mc_alias_result.rc == 0
      failed_when: mc_alias_result.rc not in [0]

  handlers:
    - name: restart minio
      service:
        name: minio
        state: restarted
