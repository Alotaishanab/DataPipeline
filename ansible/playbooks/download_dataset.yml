- name: Download and Upload Protein Dataset into HDFS
  hosts: worker1
  become: yes
  become_user: almalinux
  vars:
    dataset_local_path: "/mnt/datasets/uniref50.fasta.gz"
    unzipped_dataset_path: "/mnt/datasets/uniref50.fasta"
    dataset_download_url: "https://ftp.uniprot.org/pub/databases/uniprot/uniref/uniref50/uniref50.fasta.gz"
    hdfs_target_dir: "/user/almalinux/datasets"
  tasks:

    - name: Ensure local dataset directory exists
      ansible.builtin.file:
        path: "{{ dataset_local_path | dirname }}"
        state: directory
        mode: '0755'

    - name: Check if dataset file exists on remote host
      ansible.builtin.stat:
        path: "{{ dataset_local_path }}"
      register: dataset_file

    - name: Download Protein Dataset if not present
      ansible.builtin.get_url:
        url: "{{ dataset_download_url }}"
        dest: "{{ dataset_local_path }}"
        mode: '0644'
      when: not dataset_file.stat.exists

    - name: Re-check if dataset file exists after download
      ansible.builtin.stat:
        path: "{{ dataset_local_path }}"
      register: dataset_file_after

    - name: Fail if dataset file still does not exist after download
      ansible.builtin.fail:
        msg: "❌ Dataset file not found at {{ dataset_local_path }}"
      when: not dataset_file_after.stat.exists

    - name: Decompress FASTA.GZ file to .fasta (only if unzipped version not present)
      become: true
      become_user: root
      ansible.builtin.shell: |
        gunzip -c {{ dataset_local_path }} > {{ dataset_local_path | regex_replace('.gz$', '') }}
      args:
        creates: "{{ dataset_local_path | regex_replace('.gz$', '') }}"

    - name: Create HDFS target directory
      ansible.builtin.shell: >
        /home/almalinux/hadoop-3.4.0/bin/hdfs
        --config /home/almalinux/hadoop-3.4.0/etc/hadoop
        dfs -mkdir -p {{ hdfs_target_dir }}
      environment:
        HADOOP_CONF_DIR: "/home/almalinux/hadoop-3.4.0/etc/hadoop"

    - name: Upload decompressed FASTA dataset to HDFS
      ansible.builtin.shell: >
        /home/almalinux/hadoop-3.4.0/bin/hdfs
        --config /home/almalinux/hadoop-3.4.0/etc/hadoop
        dfs -put -f {{ unzipped_dataset_path }} {{ hdfs_target_dir }}/
      environment:
        HADOOP_CONF_DIR: "/home/almalinux/hadoop-3.4.0/etc/hadoop"

    - name: Verify uncompressed file exists in HDFS
      ansible.builtin.shell: >
        /home/almalinux/hadoop-3.4.0/bin/hdfs
        --config /home/almalinux/hadoop-3.4.0/etc/hadoop
        dfs -test -e {{ hdfs_target_dir }}/uniref50.fasta
      environment:
        HADOOP_CONF_DIR: "/home/almalinux/hadoop-3.4.0/etc/hadoop"
      register: hdfs_test
      ignore_errors: true

    - name: Fail if uncompressed file not found in HDFS
      ansible.builtin.fail:
        msg: "❌ Uncompressed file was not found in HDFS at {{ hdfs_target_dir }}/uniref50.fasta"
      when: hdfs_test.rc != 0

    - name: Debug success message
      ansible.builtin.debug:
        msg: "✅ Dataset uploaded and verified in HDFS at {{ hdfs_target_dir }}/uniref50.fasta"
      when: hdfs_test.rc == 0
