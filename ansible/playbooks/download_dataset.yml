- name: Download, Split, and Upload Protein Dataset into HDFS
  hosts: worker1
  become: yes
  become_user: almalinux

  vars:
    dataset_dir: "/mnt/data"
    dataset_gz: "uniref50.fasta.gz"
    dataset_fasta: "uniref50.fasta"
    dataset_local_path: "{{ dataset_dir }}/{{ dataset_gz }}"
    unzipped_dataset_path: "{{ dataset_dir }}/{{ dataset_fasta }}"
    fasta_split_dir: "{{ dataset_dir }}/fasta_parts"
    split_script_local_path: "../scripts/split_fasta.py"
    split_script_remote_path: "/home/almalinux/split_fasta.py"
    dataset_download_url: "https://ftp.uniprot.org/pub/databases/uniprot/uniref/uniref50/uniref50.fasta.gz"
    hdfs_target_dir: "/user/almalinux/datasets/fasta_parts"
    hadoop_bin: "/home/almalinux/hadoop-3.4.0/bin/hdfs"
    hadoop_conf: "/home/almalinux/hadoop-3.4.0/etc/hadoop"
    esm_venv_path: "/opt/esm/venv"

  tasks:

    - name: Ensure local dataset directory exists
      file:
        path: "{{ dataset_dir }}"
        state: directory
        mode: '0755'

    - name: Check if uncompressed FASTA file already exists
      stat:
        path: "{{ unzipped_dataset_path }}"
      register: fasta_file

    - name: Download .gz dataset if .fasta does not exist
      get_url:
        url: "{{ dataset_download_url }}"
        dest: "{{ dataset_local_path }}"
        mode: '0644'
      when: not fasta_file.stat.exists

    - name: Decompress .gz to .fasta (only if .fasta not yet present)
      shell: |
        gunzip -c "{{ dataset_local_path }}" > "{{ unzipped_dataset_path }}"
      args:
        creates: "{{ unzipped_dataset_path }}"
      when: not fasta_file.stat.exists

    - name: Remove .gz file after decompression
      file:
        path: "{{ dataset_local_path }}"
        state: absent
      when: not fasta_file.stat.exists

    - name: Copy split_fasta.py to worker1
      copy:
        src: "{{ split_script_local_path }}"
        dest: "{{ split_script_remote_path }}"
        mode: '0755'

    - name: Run FASTA splitting script
      shell: |
        source {{ esm_venv_path }}/bin/activate
        python {{ split_script_remote_path }} "{{ unzipped_dataset_path }}" "{{ fasta_split_dir }}"
      args:
        creates: "{{ fasta_split_dir }}"
        chdir: "/home/almalinux"

    - name: Ensure HDFS target directory exists
      shell: >
        {{ hadoop_bin }} --config {{ hadoop_conf }}
        dfs -mkdir -p {{ hdfs_target_dir }}
      environment:
        HADOOP_CONF_DIR: "{{ hadoop_conf }}"

    - name: Upload split FASTA files to HDFS
      shell: >
        {{ hadoop_bin }} --config {{ hadoop_conf }}
        dfs -put -f {{ fasta_split_dir }}/* {{ hdfs_target_dir }}/
      environment:
        HADOOP_CONF_DIR: "{{ hadoop_conf }}"

    - name: Debug success message
      debug:
        msg: "✅ Split dataset uploaded to HDFS: {{ hdfs_target_dir }}"
