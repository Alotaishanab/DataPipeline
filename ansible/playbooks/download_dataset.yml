- name: Upload and Split Full Protein FASTA File to HDFS
  hosts: worker1
  become: yes
  become_user: almalinux

  vars:
    dataset_dir: "/mnt/data"
    dataset_gz: "uniref50.fasta.gz"
    dataset_fasta: "uniref50.fasta"
    dataset_local_path: "{{ dataset_dir }}/{{ dataset_gz }}"
    unzipped_dataset_path: "{{ dataset_dir }}/{{ dataset_fasta }}"
    dataset_download_url: "https://ftp.uniprot.org/pub/databases/uniprot/uniref/uniref50/uniref50.fasta.gz"
    split_dir: "{{ dataset_dir }}/chunks"
    chunk_size: 1000
    hdfs_target_dir: "/user/almalinux/datasets/chunks"
    hadoop_bin: "/home/almalinux/hadoop-3.4.0/bin/hdfs"
    hadoop_conf: "/home/almalinux/hadoop-3.4.0/etc/hadoop"
    seqkit_url: "https://github.com/shenwei356/seqkit/releases/download/v2.6.1/seqkit_linux_amd64.tar.gz"
    seqkit_tar: "/tmp/seqkit_linux_amd64.tar.gz"
    seqkit_bin: "/usr/local/bin/seqkit"

  tasks:
    - name: Ensure local dataset directory exists
      file:
        path: "{{ dataset_dir }}"
        state: directory
        mode: '0755'

    - name: Ensure chunk directory exists
      file:
        path: "{{ split_dir }}"
        state: directory
        mode: '0755'

    - name: Check if uncompressed FASTA file already exists
      stat:
        path: "{{ unzipped_dataset_path }}"
      register: fasta_file

    - name: Download .gz dataset if .fasta does not exist
      get_url:
        url: "{{ dataset_download_url }}"
        dest: "{{ dataset_local_path }}"
        mode: '0644'
      when: not fasta_file.stat.exists

    - name: Decompress .gz to .fasta (only if .fasta not yet present)
      shell: |
        gunzip -c "{{ dataset_local_path }}" > "{{ unzipped_dataset_path }}"
      args:
        creates: "{{ unzipped_dataset_path }}"
      when: not fasta_file.stat.exists

    - name: Remove .gz file after decompression
      file:
        path: "{{ dataset_local_path }}"
        state: absent
      when: not fasta_file.stat.exists

    - name: Download seqkit binary if not present
      get_url:
        url: "{{ seqkit_url }}"
        dest: "{{ seqkit_tar }}"
        mode: '0755'
      when: not lookup('ansible.builtin.stat', seqkit_bin).stat.exists
      become: yes

    - name: Extract and install seqkit binary
      shell: |
        tar -xzf {{ seqkit_tar }} -C /tmp
        mv /tmp/seqkit /usr/local/bin/seqkit
        chmod +x /usr/local/bin/seqkit
      args:
        creates: "{{ seqkit_bin }}"
      become: yes
      when: not lookup('ansible.builtin.stat', seqkit_bin).stat.exists

    - name: Split FASTA into chunks of {{ chunk_size }} records
      shell: |
        {{ seqkit_bin }} split -s {{ chunk_size }} -O {{ split_dir }} {{ unzipped_dataset_path }}
      args:
        creates: "{{ split_dir }}/chunk_001.fasta"

    - name: Ensure HDFS chunk target directory exists
      shell: >
        {{ hadoop_bin }} --config {{ hadoop_conf }} dfs -mkdir -p {{ hdfs_target_dir }}
      environment:
        HADOOP_CONF_DIR: "{{ hadoop_conf }}"

    - name: Upload chunked FASTA files to HDFS
      shell: |
        for file in {{ split_dir }}/*.fasta; do
          {{ hadoop_bin }} --config {{ hadoop_conf }} dfs -put -f "$file" {{ hdfs_target_dir }}/
        done
      environment:
        HADOOP_CONF_DIR: "{{ hadoop_conf }}"

    - name: Debug success message
      debug:
        msg: "✅ FASTA chunks uploaded to HDFS: {{ hdfs_target_dir }}"
