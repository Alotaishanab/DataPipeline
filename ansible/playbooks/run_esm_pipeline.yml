- name: Copy and Run ESM Pipeline Controller
  hosts: mgmtnode
  become: yes
  become_user: almalinux

  vars:
    controller_local_path: "../scripts/controller.py"
    controller_remote_path: "/home/almalinux/esm_pipeline/controller.py"
    venv_path: "/opt/esm/venv"

  tasks:
    - name: Create pipeline directory if it doesn't exist
      file:
        path: "{{ controller_remote_path | dirname }}"
        state: directory
        owner: almalinux
        group: almalinux
        mode: '0755'

    - name: Copy controller.py to mgmtnode
      copy:
        src: "{{ controller_local_path }}"
        dest: "{{ controller_remote_path }}"
        mode: '0755'

    - name: Run controller.py to start the pipeline
      shell: |
        source {{ venv_path }}/bin/activate
        python {{ controller_remote_path }}
      args:
        chdir: "{{ controller_remote_path | dirname }}"
