---
- name: Deploy ESM pipeline to workers
  hosts: worker_inventory
  become: yes
  become_user: almalinux
  vars:
    venv_path: "/opt/esm/venv"
    celery_app_path: "/home/almalinux/celery_app"
    chunks_dir: "/mnt/data_volume/datasets/internal_chunks"

  tasks:
    - name: Ensure celery app directory exists
      file:
        path: "{{ celery_app_path }}"
        state: directory
        owner: almalinux
        group: almalinux
        mode: '0755'

    - name: Create __init__.py to expose Celery worker app
      copy:
        dest: "{{ celery_app_path }}/__init__.py"
        content: |
          from .celery_worker import app as celery
        owner: almalinux
        group: almalinux
        mode: '0644'

    - name: Copy celery_worker.py to celery app
      copy:
        src: "../scripts/celery_worker.py"
        dest: "{{ celery_app_path }}/celery_worker.py"
        owner: almalinux
        group: almalinux
        mode: '0755'
        force: yes

    - name: Ensure GlusterFS chunk directory is writable
      file:
        path: "{{ chunks_dir }}"
        owner: almalinux
        group: almalinux
        mode: '0775'

- name: Deploy Celery app on mgmt node for controller support
  hosts: localhost
  become: yes
  become_user: almalinux
  vars:
    celery_app_path: "/home/almalinux/celery_app"

  tasks:
    - name: Ensure celery app directory exists on mgmt node
      file:
        path: "{{ celery_app_path }}"
        state: directory
        owner: almalinux
        group: almalinux
        mode: '0755'

    - name: Copy minimal Celery client (app.py) to mgmt node
      copy:
        src: "../scripts/celery_app_app.py"
        dest: "{{ celery_app_path }}/app.py"
        owner: almalinux
        group: almalinux
        mode: '0644'

    - name: Create __init__.py that exposes minimal app (no torch)
      copy:
        dest: "{{ celery_app_path }}/__init__.py"
        content: |
          from .app import app as celery
        owner: almalinux
        group: almalinux
        mode: '0644'

- name: Trigger ESM controller on mgmt node
  hosts: localhost
  become: yes
  become_user: almalinux
  vars:
    venv_path: "/opt/esm/venv"
    controller_dir: "/home/almalinux/esm_pipeline"
    controller_remote_path: "{{ controller_dir }}/controller.py"

  tasks:
    - name: Ensure controller directory exists
      file:
        path: "{{ controller_dir }}"
        state: directory
        owner: almalinux
        group: almalinux
        mode: '0755'

    - name: Copy updated controller.py to mgmt node
      copy:
        src: "../scripts/controller.py"
        dest: "{{ controller_remote_path }}"
        owner: almalinux
        group: almalinux
        mode: '0755'

    - name: Start new controller.py in background
      shell: |
        source {{ venv_path }}/bin/activate
        export PYTHONPATH=/home/almalinux
        nohup python {{ controller_remote_path }} > /mnt/data_volume/results/controller_submit_log.txt 2>&1 &
      args:
        chdir: "{{ controller_dir }}"
