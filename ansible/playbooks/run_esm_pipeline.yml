# This part sets up only what's needed on the worker nodes
- name: Deploy ESM pipeline to workers
  hosts: worker_inventory
  become: yes
  become_user: almalinux
  vars:
    venv_path: "/opt/esm/venv"
    celery_app_path: "/home/almalinux/celery_app"
    chunks_dir: "/mnt/data_volume/datasets/uni_chunks"

  tasks:
    - name: Ensure celery app directory exists
      file:
        path: "{{ celery_app_path }}"
        state: directory
        owner: almalinux
        group: almalinux
        mode: '0755'

    - name: Ensure __init__.py exists to make celery_app a Python module
      file:
        path: "{{ celery_app_path }}/__init__.py"
        state: touch
        owner: almalinux
        group: almalinux
        mode: '0644'

    - name: Copy worker.py to celery app
      copy:
        src: "../scripts/worker.py"
        dest: "{{ celery_app_path }}/worker.py"
        owner: almalinux
        group: almalinux
        mode: '0755'
        force: yes

    - name: Ensure GlusterFS chunk directory is writable
      file:
        path: "{{ chunks_dir }}"
        owner: almalinux
        group: almalinux
        mode: '0775'

    - name: Remove old esm_pipeline/worker.py (deprecated)
      file:
        path: /home/almalinux/esm_pipeline/worker.py
        state: absent
      ignore_errors: yes


- name: Restart Celery workers if any were previously running
  hosts: worker_inventory
  become: yes
  become_user: root

  tasks:
    - name: Stop celery systemd service cleanly (if running)
      systemd:
        name: celery-worker.service
        state: stopped
      ignore_errors: yes

    - name: Kill leftover Celery worker processes (if any)
      shell: |
        pkill -9 -f "celery.*worker" || true
      ignore_errors: yes

    - name: Start celery worker systemd service
      systemd:
        name: celery-worker.service
        state: started
        enabled: yes


# This section handles ONLY the controller on the mgmt node
- name: Trigger ESM controller on mgmt node
  hosts: localhost
  become: yes
  become_user: almalinux
  vars:
    venv_path: "/opt/esm/venv"
    controller_dir: "/home/almalinux/esm_pipeline"
    controller_remote_path: "{{ controller_dir }}/controller.py"

  tasks:
    - name: Ensure controller directory exists
      file:
        path: "{{ controller_dir }}"
        state: directory
        owner: almalinux
        group: almalinux
        mode: '0755'

    - name: Copy updated controller.py to mgmt node
      copy:
        src: "../scripts/controller.py"
        dest: "{{ controller_remote_path }}"
        owner: almalinux
        group: almalinux
        mode: '0755'

    - name: Kill existing controller.py if running
      shell: |
        pids=$(pgrep -f "{{ controller_remote_path }}")
        if [ -n "$pids" ]; then
          echo "Killing old controller.py: $pids"
          kill $pids
        fi
      ignore_errors: yes

    - name: Start new controller.py in background
      shell: |
        source {{ venv_path }}/bin/activate
        nohup python {{ controller_remote_path }} > controller.log 2>&1 &
      args:
        chdir: "{{ controller_dir }}"
