- name: Trigger ESM Pipeline on workers
  hosts: worker_inventory
  become: yes
  become_user: almalinux

  vars:
    venv_path: "/opt/esm/venv"
    controller_dir: "/home/almalinux/esm_pipeline"
    controller_remote_path: "{{ controller_dir }}/controller.py"
    celery_worker_remote_path: "{{ controller_dir }}/celery_worker.py"

  tasks:
    - name: Ensure pipeline directory exists
      file:
        path: "{{ controller_dir }}"
        state: directory
        owner: almalinux
        group: almalinux
        mode: '0755'

    - name: Copy controller.py to worker
      copy:
        src: "../scripts/controller.py"
        dest: "{{ controller_remote_path }}"
        owner: almalinux
        group: almalinux
        mode: '0755'

    - name: Copy celery_worker.py to worker
      copy:
        src: "../scripts/celery_worker.py"
        dest: "{{ celery_worker_remote_path }}"
        owner: almalinux
        group: almalinux
        mode: '0755'

    - name: Run controller.py in ESM virtualenv (auto-discovers chunk)
      shell: |
        source {{ venv_path }}/bin/activate
        python {{ controller_remote_path }}
      args:
        chdir: "{{ controller_dir }}"
