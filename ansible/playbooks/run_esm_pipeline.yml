- name: Deploy ESM pipeline to workers
  hosts: worker_inventory
  become: yes
  become_user: almalinux
  vars:
    venv_path: "/opt/esm/venv"
    controller_dir: "/home/almalinux/esm_pipeline"
    chunks_dir: "/mnt/data_volume/datasets/uni_chunks"
  tasks:
    - name: Ensure pipeline directory exists
      file:
        path: "{{ controller_dir }}"
        state: directory
        owner: almalinux
        group: almalinux
        mode: '0755'

    - name: Copy controller.py from mgmt node to workers
      copy:
        src: "{{ controller_dir }}/controller.py"
        dest: "{{ controller_dir }}/controller.py"
        owner: almalinux
        group: almalinux
        mode: '0755'
      delegate_to: localhost

    - name: Copy worker.py from mgmt node to workers
      copy:
        src: "{{ controller_dir }}/worker.py"
        dest: "{{ controller_dir }}/worker.py"
        owner: almalinux
        group: almalinux
        mode: '0755'
      delegate_to: localhost

    - name: Ensure GlusterFS chunk directory is writable
      file:
        path: "{{ chunks_dir }}"
        owner: almalinux
        group: almalinux
        mode: '0775'


- name: Restart Celery workers if any were previously running
  hosts: worker_inventory
  become: yes
  tasks:
    - name: Kill old celery workers (ignore if none)
      shell: |
        pids=$(pgrep -f "celery.*worker")
        if [ -n "$pids" ]; then
          echo "Killing existing celery workers: $pids"
          kill -9 $pids
        fi
      ignore_errors: yes

    - name: Restart celery worker systemd service
      systemd:
        name: celery-worker.service
        state: restarted
        enabled: yes


- name: Trigger ESM controller on mgmt node
  hosts: localhost
  become: yes
  become_user: almalinux
  vars:
    venv_path: "/opt/esm/venv"
    controller_dir: "/home/almalinux/esm_pipeline"
    controller_remote_path: "{{ controller_dir }}/controller.py"
  tasks:
    - name: Ensure pipeline directory exists
      file:
        path: "{{ controller_dir }}"
        state: directory
        owner: almalinux
        group: almalinux
        mode: '0755'

    - name: Copy updated controller.py to mgmt node
      copy:
        src: "../scripts/controller.py"
        dest: "{{ controller_remote_path }}"
        owner: almalinux
        group: almalinux
        mode: '0755'

    - name: Kill existing controller.py if running
      shell: |
        pids=$(pgrep -f "{{ controller_remote_path }}")
        if [ -n "$pids" ]; then
          echo "Killing old controller.py: $pids"
          kill $pids
        fi
      ignore_errors: yes

    - name: Start new controller.py in background
      shell: |
        source {{ venv_path }}/bin/activate
        nohup python {{ controller_remote_path }} > controller.log 2>&1 &
      args:
        chdir: "{{ controller_dir }}"
