- name: Distribute ESM Pipeline and Split Script to All Workers
  hosts: worker_inventory
  become: yes
  become_user: almalinux
  vars:
    pipeline_local_source: "../scripts/run_pipeline.py"
    split_script_local: "../scripts/split_fasta.py"
    pipeline_remote_path: "/home/almalinux/run_pipeline.py"
    split_script_remote_path: "/home/almalinux/split_fasta.py"

  tasks:
    - name: Copy ESM pipeline script
      copy:
        src: "{{ pipeline_local_source }}"
        dest: "{{ pipeline_remote_path }}"
        mode: '0755'

    - name: Copy FASTA splitting script
      copy:
        src: "{{ split_script_local }}"
        dest: "{{ split_script_remote_path }}"
        mode: '0755'


- name: Pre-split FASTA into one sequence per file in HDFS
  hosts: worker1
  become: yes
  become_user: almalinux
  vars:
    esm_venv_path: "/opt/esm/venv"
    py_version: "3.9"
    input_fasta: "/home/almalinux/uniref50.fasta"
    output_dir: "/home/almalinux/fasta_parts"
    hdfs_dest: "/user/almalinux/datasets/fasta_parts"
    split_script_path: "/home/almalinux/split_fasta.py"

  tasks:
    - name: Run FASTA splitter script
      shell: |
        source {{ esm_venv_path }}/bin/activate
        python {{ split_script_path }} "{{ input_fasta }}" "{{ output_dir }}"
      args:
        chdir: "/home/almalinux"

    - name: Upload split FASTA files to HDFS
      shell: |
        hdfs dfs -mkdir -p {{ hdfs_dest }}
        hdfs dfs -put -f {{ output_dir }}/* {{ hdfs_dest }}


- name: Submit Spark Job Using All Worker Nodes
  hosts: worker1
  become: yes
  become_user: almalinux
  vars:
    esm_venv_path: "/opt/esm/venv"
    pipeline_remote_path: "/home/almalinux/run_pipeline.py"
    py_version: "3.9"
    spark_home: "/home/almalinux/spark-3.5.3-bin-hadoop3-scala2.13"
    hadoop_conf_dir: "/home/almalinux/hadoop-3.4.0/etc/hadoop"

  tasks:
    - name: Submit Spark job to use 16 cores across all workers
      shell: |
        nohup bash -c '
          echo ">>> Starting pipeline at $(date)" >> pipeline_loop.log

          {{ spark_home }}/bin/spark-submit \
            --master yarn \
            --deploy-mode cluster \
            --num-executors 8 \
            --executor-cores 2 \
            --executor-memory 6G \
            --driver-memory 8G \
            --conf "spark.executor.memoryOverhead=2G" \
            --conf "spark.sql.shuffle.partitions=64" \
            --conf "spark.yarn.submit.waitAppCompletion=true" \
            --conf "spark.yarn.appMasterEnv.PYSPARK_PYTHON={{ esm_venv_path }}/bin/python" \
            --conf "spark.yarn.appMasterEnv.PYTHONPATH={{ esm_venv_path }}/lib/python{{ py_version }}/site-packages" \
            --conf "spark.executorEnv.PYSPARK_PYTHON={{ esm_venv_path }}/bin/python" \
            --conf "spark.executorEnv.PYTHONPATH={{ esm_venv_path }}/lib/python{{ py_version }}/site-packages" \
            --conf "spark.executorEnv.TORCH_HOME=/tmp/torch_cache" \
            --conf "spark.yarn.appMasterEnv.TORCH_HOME=/tmp/torch_cache" \
            "{{ pipeline_remote_path }}" >> pipeline_loop.log 2>&1

          echo ">>> Pipeline run completed at $(date)" >> pipeline_loop.log
        ' &
      args:
        chdir: "/home/almalinux"
      environment:
        HADOOP_CONF_DIR: "{{ hadoop_conf_dir }}"
        YARN_CONF_DIR: "{{ hadoop_conf_dir }}"
        TORCH_HOME: "/tmp/torch_cache"
