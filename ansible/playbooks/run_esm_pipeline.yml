- name: Trigger ESM Pipeline on workers
  hosts: worker_inventory
  become: yes
  become_user: almalinux
  vars:
    venv_path: "/opt/esm/venv"
    controller_dir: "/home/almalinux/esm_pipeline"
    controller_remote_path: "{{ controller_dir }}/controller.py"
    celery_worker_remote_path: "{{ controller_dir }}/worker.py"
    chunks_dir: "/mnt/data_volume/datasets/uni_chunks"
  tasks:
    - name: Ensure pipeline directory exists
      file:
        path: "{{ controller_dir }}"
        state: directory
        owner: almalinux
        group: almalinux
        mode: '0755'

    - name: Copy updated controller.py (Gluster version) to worker
      copy:
        src: "../scripts/controller.py"
        dest: "{{ controller_remote_path }}"
        owner: almalinux
        group: almalinux
        mode: '0755'

    - name: Copy worker.py (celery tasks) to worker
      copy:
        src: "../scripts/worker.py"
        dest: "{{ celery_worker_remote_path }}"
        owner: almalinux
        group: almalinux
        mode: '0755'

    - name: Ensure GlusterFS chunk directory is writable
      file:
        path: "{{ chunks_dir }}"
        owner: almalinux
        group: almalinux
        mode: '0775'

    - name: Run controller.py in ESM virtualenv (background job)
      shell: |
        source {{ venv_path }}/bin/activate
        nohup python {{ controller_remote_path }} > controller.log 2>&1 &
      args:
        chdir: "{{ controller_dir }}"
