- name: Run ESM Pipeline from a Worker Node Asynchronously
  hosts: worker1
  become: yes
  become_user: almalinux
  vars:
    # ESM virtual environment path
    esm_venv_path: "/opt/esm/venv"
    # Local path to your Spark pipeline script (relative to your ansible control machine)
    pipeline_local_source: "../scripts/run_pipeline.py"
    # Remote destination for the pipeline script on worker1
    pipeline_remote_path: "/home/almalinux/run_pipeline.py"
    # Python version used in the virtual environment
    py_version: "3.9"
    # Spark installation directory (adjust if necessary)
    spark_home: "/home/almalinux/spark-3.5.3-bin-hadoop3-scala2.13"
    # Hadoop configuration directory containing core-site.xml, yarn-site.xml, etc.
    hadoop_conf_dir: "/home/almalinux/hadoop-3.4.0/etc/hadoop"

  tasks:
    - name: Copy pipeline code to worker1
      copy:
        src: "{{ pipeline_local_source }}"
        dest: "{{ pipeline_remote_path }}"
        mode: '0755'

    - name: Check if the pipeline file exists
      stat:
        path: "{{ pipeline_remote_path }}"
      register: pipeline_file

    - debug:
        msg: "Pipeline file exists: {{ pipeline_file.stat.exists }}"

    - name: Submit Spark job loop as background process (24-hour stress test)
      shell: |
        nohup bash -c '
          start=$(date +%s)
          end=$((start + 86400))
          while [ $(date +%s) -lt $end ]; do
            echo ">>> Starting pipeline at $(date)" >> pipeline_loop.log

            {{ spark_home }}/bin/spark-submit \
              --master yarn \
              --deploy-mode cluster \
              --num-executors 12 \
              --executor-cores 4 \
              --executor-memory 4G \
              --driver-memory 4G \
              --conf "spark.yarn.submit.waitAppCompletion=true" \
              --conf "spark.yarn.appMasterEnv.PYSPARK_PYTHON={{ esm_venv_path }}/bin/python" \
              --conf "spark.yarn.appMasterEnv.PYTHONPATH={{ esm_venv_path }}/lib/python{{ py_version }}/site-packages" \
              --conf "spark.executorEnv.PYSPARK_PYTHON={{ esm_venv_path }}/bin/python" \
              --conf "spark.executorEnv.PYTHONPATH={{ esm_venv_path }}/lib/python{{ py_version }}/site-packages" \
              --conf "spark.executorEnv.TORCH_HOME=/tmp/torch_cache" \
              --conf "spark.yarn.appMasterEnv.TORCH_HOME=/tmp/torch_cache" \
              "{{ pipeline_remote_path }}" >> pipeline_loop.log 2>&1

            echo ">>> Pipeline run completed at $(date)" >> pipeline_loop.log
          done
        ' &
      args:
        chdir: "/home/almalinux"
      environment:
        HADOOP_CONF_DIR: "{{ hadoop_conf_dir }}"
        YARN_CONF_DIR: "{{ hadoop_conf_dir }}"
        TORCH_HOME: "/tmp/torch_cache"



