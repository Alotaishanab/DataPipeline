- name: Configure firewall for cluster and monitoring
  hosts: all
  become: true
  become_user: root

  tasks:
    - name: Ensure firewalld is installed
      ansible.builtin.yum:
        name: firewalld
        state: present

    - name: Ensure firewalld is started and enabled
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: Open required ports using firewalld (permanent)
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: true
        state: enabled
        immediate: true
      loop:
        - 80     # HTTP
        - 443    # HTTPS
        - 3000   # Grafana
        - 5555   # Celery Flower UI
        - 8080   # Flask Web UI
        - 9000   # MinIO main endpoint
        - 9001   # MinIO console
        - 9090   # Prometheus
        - 9100   # Node Exporter
        - 6379
        - 5555   # Celery Flower UI

    - name: Open NFS ports on worker1
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: yes
        state: enabled
        immediate: true
      loop:
        - 2049/tcp
        - 111/tcp
        - 111/udp
      when: ansible_hostname == 'worker1'

    - name: Allow HTTP and HTTPS in firewalld
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: yes
        state: enabled
        immediate: true
      loop:
        - http
        - https

    - name: Remove ephemeral port range from firewalld
      ansible.posix.firewalld:
        port: "32768-61000/tcp"
        permanent: true
        state: disabled
        immediate: true

    # --- UFW Section ---
    - name: Check if UFW is installed
      ansible.builtin.command: which ufw
      register: ufw_installed
      ignore_errors: true

    - name: Enable UFW (if installed)
      ansible.builtin.command: ufw --force enable
      when: ufw_installed.rc == 0
      ignore_errors: true

    - name: Allow required ports in UFW
      ansible.builtin.command: ufw allow {{ item }}/tcp
      loop:
        - 80     # HTTP
        - 443    # HTTPS
        - 3000   # Grafana
        - 5555   # Celery Flower UI
        - 8080   # Flask Web UI
        - 9000   # MinIO main endpoint
        - 9001   # MinIO console
        - 9090   # Prometheus
        - 9100   # Node Exporter
        - 6379   # Redis for Celery broker
        - 5555   # Celery Flower UI
      when: ufw_installed.rc == 0
      ignore_errors: true


    - name: Allow HTTP and HTTPS in UFW
      ansible.builtin.command: ufw allow {{ item }}
      loop:
        - http
        - https
      when: ufw_installed.rc == 0
      ignore_errors: true

    - name: Remove ephemeral ports in UFW if previously added
      ansible.builtin.command: ufw delete allow 32768:61000/tcp
      when: ufw_installed.rc == 0
      ignore_errors: true

    - name: Reload UFW
      ansible.builtin.command: ufw reload
      when: ufw_installed.rc == 0
      ignore_errors: true

    - name: Open GlusterFS management port 24007/tcp using firewalld
      ansible.posix.firewalld:
        port: "24007/tcp"
        permanent: yes
        state: enabled
        immediate: yes

    - name: Open GlusterFS management port 24008/tcp using firewalld
      ansible.posix.firewalld:
        port: "24008/tcp"
        permanent: yes
        state: enabled
        immediate: yes

    - name: Open GlusterFS brick port range 49152-49251/tcp using firewalld
      ansible.posix.firewalld:
        port: "49152-49251/tcp"
        permanent: yes
        state: enabled
        immediate: yes

    - name: Allow GlusterFS management port 24007/tcp in UFW
      ansible.builtin.command: ufw allow 24007/tcp
      when: ufw_installed.rc == 0
      ignore_errors: true

    - name: Open extended GlusterFS brick port range (49152-65535/tcp) using firewalld
      ansible.posix.firewalld:
        port: "49152-65535/tcp"
        permanent: yes
        state: enabled
        immediate: yes

    - name: Allow extended GlusterFS brick port range in UFW (49152:65535/tcp)
      ansible.builtin.command: ufw allow 49152:65535/tcp
      when: ufw_installed.rc == 0
      ignore_errors: true

    - name: Reload firewalld to apply changes
      ansible.builtin.service:
        name: firewalld
        state: reloaded
