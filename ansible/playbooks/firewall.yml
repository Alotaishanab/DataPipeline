- name: Configure firewall for Hadoop cluster and monitoring
  hosts: all, localhost
  become: true
  become_user: root

  tasks:
    - name: Ensure firewalld is installed
      ansible.builtin.yum:
        name: firewalld
        state: present

    - name: Ensure firewalld is started and enabled
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: Open Hadoop NameNode and YARN ports (permanent)
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - 9000
        - 9870
        - 8088
        - 8025
        - 8035
        - 8050

    - name: Open monitoring ports (permanent)
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - 3000
        - 9090
        - 9100

    - name: Open DataNode fixed ports (permanent)
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - 9864     # DataNode Web UI
        - 9866     # DataNode data transfer
        - 9867     # DataNode IPC

    - name: Open legacy DataNode ports (if needed)
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - 50010
        - 50020
        - 50075

    - name: Open NodeManager Web UI port (8042)
      ansible.posix.firewalld:
        port: "8042/tcp"
        permanent: yes
        state: enabled
        immediate: yes

    - name: Open NodeManager RPC port (8041)
      ansible.posix.firewalld:
        port: "8041/tcp"
        permanent: yes
        state: enabled
        immediate: yes

    - name: Open port 8080/tcp for Flask Upload UI
      ansible.posix.firewalld:
        port: "8080/tcp"
        permanent: yes
        state: enabled
        immediate: yes

    - name: Allow HTTP and HTTPS in firewall
      ansible.posix.firewalld:
        service: "{{ item }}"
        state: enabled
        permanent: yes
        immediate: yes
      loop:
        - http
        - https
      notify: reload firewalld

    - name: Remove ephemeral port range from firewall (if previously added)
      ansible.posix.firewalld:
        port: "32768-61000/tcp"
        permanent: yes
        state: disabled
        immediate: yes

    - name: Reload firewalld to apply changes
      ansible.builtin.shell: firewall-cmd --reload

    ######################################################################
    # Optional UFW fallback — useful for machines using UFW over firewalld
    ######################################################################

    - name: Check if UFW is installed
      ansible.builtin.command: which ufw
      register: ufw_installed
      ignore_errors: yes

    - name: Allow fixed DataNode ports in UFW
      ansible.builtin.command: ufw allow "{{ item }}/tcp"
      loop:
        - 9864
        - 9866
        - 9867
      when: ufw_installed.rc == 0

    - name: Allow NodeManager RPC port (8041) in UFW
      ansible.builtin.command: ufw allow 8041/tcp
      when: ufw_installed.rc == 0

    - name: Allow port 8080/tcp in UFW (if needed)
      ansible.builtin.command: ufw allow 8080/tcp
      when: ufw_installed.rc == 0

    - name: Allow HTTP and HTTPS in UFW
      ansible.builtin.command: ufw allow "{{ item }}"
      loop:
        - http
        - https
      when: ufw_installed.rc == 0

    - name: Remove ephemeral ports in UFW if previously added
      ansible.builtin.command: ufw delete allow 32768:61000/tcp
      when: ufw_installed.rc == 0
      ignore_errors: yes

    - name: Reload UFW
      ansible.builtin.command: ufw reload
      when: ufw_installed.rc == 0

  handlers:
    - name: reload firewalld
      ansible.builtin.service:
        name: firewalld
        state: reloaded
