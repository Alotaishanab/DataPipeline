- name: Configure firewall for Hadoop cluster and monitoring
  hosts: all, localhost
  become: true
  become_user: root

  tasks:
    - name: Ensure firewalld is installed
      ansible.builtin.yum:
        name: firewalld
        state: present

    - name: Ensure firewalld is started and enabled
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: Open required ports using firewalld (permanent)
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: true
        state: enabled
        immediate: true
      loop:
        - 9000    # HDFS
        - 9870    # HDFS Web UI
        - 8088    # YARN ResourceManager UI
        - 8025    # ResourceManager ResourceTracker
        - 8035    # ResourceManager Scheduler
        - 8050    # ResourceManager Address
        - 3000    # Grafana
        - 9090    # Prometheus
        - 9100    # Node Exporter
        - 9864    # DataNode Web UI
        - 9866    # DataNode Data Transfer
        - 9867    # DataNode IPC
        - 50010   # Legacy DataNode transfer
        - 50020   # Legacy IPC
        - 50075   # Legacy UI
        - 8042    # NodeManager Web UI
        - 8041    # NodeManager RPC
        - 8080    # Flask Web UI

    - name: Allow HTTP and HTTPS in firewalld
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - http
        - https

    - name: Remove ephemeral port range from firewalld
      ansible.posix.firewalld:
        port: "32768-61000/tcp"
        permanent: yes
        state: disabled
        immediate: yes

    - name: Reload firewalld to apply changes
      ansible.builtin.service:
        name: firewalld
        state: reloaded

    # --- UFW Section ---
    - name: Check if UFW is installed
      ansible.builtin.command: which ufw
      register: ufw_installed
      ignore_errors: true

    - name: Enable UFW (if installed)
      ansible.builtin.command: ufw --force enable
      when: ufw_installed.rc == 0
      ignore_errors: true

    - name: Allow required ports in UFW
      ansible.builtin.command: ufw allow {{ item }}/tcp
      loop:
        - 9000
        - 9870
        - 8088
        - 8025
        - 8035
        - 8050
        - 3000
        - 9090
        - 9100
        - 9864
        - 9866
        - 9867
        - 50010
        - 50020
        - 50075
        - 8042
        - 8041
        - 8080
      when: ufw_installed.rc == 0
      ignore_errors: true

    - name: Allow HTTP and HTTPS in UFW
      ansible.builtin.command: ufw allow {{ item }}
      loop:
        - http
        - https
      when: ufw_installed.rc == 0
      ignore_errors: true

    - name: Remove ephemeral ports in UFW if previously added
      ansible.builtin.command: ufw delete allow 32768:61000/tcp
      when: ufw_installed.rc == 0
      ignore_errors: true

    - name: Reload UFW
      ansible.builtin.command: ufw reload
      when: ufw_installed.rc == 0
      ignore_errors: true
