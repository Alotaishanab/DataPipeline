- name: Configure firewall for Hadoop cluster, disable SELinux, and monitoring
  hosts: all, localhost
  become: yes
  become_user: root
  tasks:
    - name: Set SELinux to permissive mode (temporarily for troubleshooting)
      ansible.posix.selinux:
        state: permissive

    - name: Ensure firewalld is installed
      ansible.builtin.yum:
        name: firewalld
        state: present

    - name: Ensure firewalld is started and enabled
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: Open Hadoop NameNode and YARN ports (permanent)
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - 9000    # HDFS RPC (NameNode)
        - 9870    # HDFS Web UI (NameNode)
        - 8088    # YARN Web UI
        - 8025    # ResourceManager tracker
        - 8035    # ResourceManager scheduler
        - 8050    # ResourceManager

    - name: Open monitoring ports (permanent)
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - 3000    # Grafana
        - 9090    # Prometheus
        - 9100    # Node Exporter

    - name: Open DataNode ports (permanent)
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - 50010   # Data transfer
        - 50020   # IPC
        - 50075   # DataNode Web UI

    - name: Open NodeManager Web UI port (permanent)
      ansible.posix.firewalld:
        port: "8042/tcp"
        permanent: yes
        state: enabled
        immediate: yes

    - name: Open ephemeral port range for NodeManager communication
      ansible.posix.firewalld:
        port: "32768-61000/tcp"
        permanent: yes
        state: enabled
        immediate: yes

    - name: Reload firewalld to apply changes
      ansible.builtin.shell: "firewall-cmd --reload"
