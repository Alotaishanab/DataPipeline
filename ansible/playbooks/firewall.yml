- name: Configure firewalld for Hadoop cluster
  hosts: all
  become: true

  tasks:
    - name: Ensure firewalld is installed
      ansible.builtin.yum:
        name: firewalld
        state: present

    - name: Ensure firewalld is started and enabled
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: Open Hadoop ports in firewalld (permanent)
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: true
        state: enabled
        immediate: yes
      loop:
        - 9000    # HDFS RPC
        - 9870    # HDFS Web UI
        - 8088    # YARN Web UI
        - 8025    # ResourceManager tracker
        - 8035    # ResourceManager scheduler
        - 8050    # ResourceManager
        - 3000    # Grafana
        - 9090    # Prometheus
        - 9100    # Node Exporter
