- name: Configure firewall for Hadoop cluster, disable SELinux, and monitoring
  hosts: all, localhost
  become: true
  become_user: root
  tasks:
    - name: Set SELinux to permissive mode (temporarily for troubleshooting)
      ansible.posix.selinux:
        state: permissive
        policy: targeted

    - name: Ensure firewalld is installed
      ansible.builtin.yum:
        name: firewalld
        state: present

    - name: Ensure firewalld is started and enabled
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true

    - name: Open Hadoop NameNode and YARN ports (permanent)
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - 9000
        - 9870
        - 8088
        - 8025
        - 8035
        - 8050

    - name: Open monitoring ports (permanent)
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - 3000
        - 9090
        - 9100

    - name: Open DataNode ports (permanent)
      ansible.posix.firewalld:
        port: "{{ item }}/tcp"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - 50010
        - 50020
        - 50075

    - name: Open NodeManager Web UI port (permanent)
      ansible.posix.firewalld:
        port: "8042/tcp"
        permanent: yes
        state: enabled
        immediate: yes

    - name: Open ephemeral port range for NodeManager communication
      ansible.posix.firewalld:
        port: "32768-61000/tcp"
        permanent: yes
        state: enabled
        immediate: yes

    - name: Reload firewalld to apply changes
      ansible.builtin.shell: "firewall-cmd --reload"

    ####################################################################
    # 🔐 UFW Rules — only if UFW is installed and active
    ####################################################################
    - name: Check if UFW is installed
      command: which ufw
      register: ufw_exists
      ignore_errors: true

    - name: Allow ephemeral ports in UFW (for YARN executor comms)
      ansible.builtin.command: ufw allow 32768:61000/tcp
      when: ufw_exists.rc == 0

    - name: Reload UFW
      ansible.builtin.command: ufw reload
      when: ufw_exists.rc == 0
