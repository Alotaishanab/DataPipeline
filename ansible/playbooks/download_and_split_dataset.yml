- name: Extreme-Speed Dataset Processing
  hosts: worker1
  become: yes
  become_user: almalinux
  vars:
    dataset_dir: "/mnt/data"
    split_dir: "{{ dataset_dir }}/chunks"
    dataset_url: "https://ftp.uniprot.org/pub/databases/uniprot/uniref/uniref50/uniref50.fasta.gz"
    seqkit_url: "https://github.com/shenwei356/seqkit/releases/download/v2.6.1/seqkit_linux_amd64.tar.gz"

  tasks:
    # Phase 1: System Setup
    - name: Install critical requirements
      become: yes
      become_user: root
      package:
        name:
          - aria2
          - pigz
          - pv
          - rsync
          - tar
        state: present

    # Phase 2: SeqKit Installation
    - name: Install SeqKit (only if not already available)
      block:
        - name: Create temp directory
          file:
            path: /tmp/seqkit_install
            state: directory
            mode: '0755'

        - name: Download SeqKit tarball using aria2
          command: aria2c -x 8 -s 16 -q "{{ seqkit_url }}" -d /tmp/seqkit_install -o seqkit.tar.gz
          args:
            creates: /tmp/seqkit_install/seqkit.tar.gz

        - name: Verify seqkit tarball is a valid archive
          shell: tar -tf /tmp/seqkit_install/seqkit.tar.gz
          register: tar_check
          failed_when: tar_check.rc != 0

        - name: Extract binary
          unarchive:
            src: /tmp/seqkit_install/seqkit.tar.gz
            dest: /tmp/seqkit_install
            remote_src: yes

        - name: Find actual seqkit binary
          find:
            paths: /tmp/seqkit_install
            patterns: seqkit
            file_type: file
            recurse: yes
          register: seqkit_found

        - name: Move seqkit binary to expected location
          command: mv "{{ item.path }}" /tmp/seqkit_install/seqkit
          loop: "{{ seqkit_found.files }}"
          when: item.path != '/tmp/seqkit_install/seqkit'

        - name: Install to system
          become: yes
          become_user: root
          copy:
            src: /tmp/seqkit_install/seqkit
            dest: /usr/local/bin/seqkit
            mode: '0755'
            remote_src: yes

        - name: Cleanup temp files
          file:
            path: /tmp/seqkit_install
            state: absent
      when: '"seqkit" not in command_output'
      vars:
        command_output: "{{ lookup('pipe', 'command -v seqkit || echo missing') }}"

    # Phase 3: Parallel Dataset Split Pipeline
    - name: Stream download → decompress → split (if not already done)
      shell: |
        aria2c -x 16 -s 32 -q --dir={{ dataset_dir }} "{{ dataset_url }}" -o /dev/stdout |
        pv -petrab -s 14G |
        pigz -cd -p4 |
        /usr/local/bin/seqkit split -p 4 -j4 -O {{ split_dir }} -
      args:
        creates: "{{ split_dir }}/chunk_001.fasta"

    # Phase 4: Chunk Distribution
    - name: Distribute chunks to other workers
      vars:
        target_worker: "worker{{ item }}"
        chunk_number: "00{{ item }}"
      loop: [2,3,4]
      synchronize:
        src: "{{ split_dir }}/chunk_{{ chunk_number }}.fasta"
        dest: "{{ split_dir }}/"
        rsync_opts:
          - "--compress"
          - "--checksum"
          - "--bwlimit=0"
          - "--partial"
      delegate_to: "{{ target_worker }}"

    # Phase 5: Validation
    - name: Verify chunk files exist
      stat:
        path: "{{ split_dir }}/chunk_00{{ item }}.fasta"
      loop: [1,2,3,4]
      register: local_chunks

    - name: Final report
      debug:
        msg: |
          ⚡ PROCESSING COMPLETE ⚡
          Local Chunks: {{ local_chunks.results | selectattr('stat.exists') | list | length }}/4
