- name: Download and Split UniRef50 on Worker1, then upload to MinIO (no SeqKit)
  hosts: worker1
  become: yes

  vars:
    dataset_dir: "/mnt/data"
    chunk_dir: "{{ dataset_dir }}/chunks"
    dataset_url: "https://ftp.uniprot.org/pub/databases/uniprot/uniref/uniref50/uniref50.fasta.gz"

    # How many total chunks we want
    chunk_count: 32

    # MinIO environment
    minio_bin: "/usr/local/bin/mc"
    minio_alias: "myminio"
    minio_bucket: "fasta-bucket/chunks"

  tasks:
    ################################################################
    # 1. Ensure necessary packages
    ################################################################
    - name: Install required packages
      ansible.builtin.package:
        name:
          - wget
          - pigz
        state: present
        update_cache: yes

    ################################################################
    # 2. Create directories
    ################################################################
    - name: Ensure dataset and chunk directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ dataset_dir }}"
        - "{{ chunk_dir }}"

    ################################################################
    # 3. Download & decompress
    ################################################################
    - name: Download UniRef50 FASTA (compressed)
      ansible.builtin.command: >
        wget -O {{ dataset_dir }}/uniref50.fasta.gz {{ dataset_url }}
      args:
        creates: "{{ dataset_dir }}/uniref50.fasta.gz"

    - name: Decompress the FASTA
      ansible.builtin.command: >
        pigz -d -f {{ dataset_dir }}/uniref50.fasta.gz
      args:
        removes: "{{ dataset_dir }}/uniref50.fasta.gz"
        creates: "{{ dataset_dir }}/uniref50.fasta"

    ################################################################
    # 4. Count how many sequences & calculate chunk size
    ################################################################
    - name: Count how many sequences in the FASTA
      ansible.builtin.shell: "grep '^>' {{ dataset_dir }}/uniref50.fasta | wc -l"
      register: seq_count

    - name: Calculate how many sequences per chunk
      set_fact:
        chunk_size: "{{ (seq_count.stdout|int / chunk_count) | round(0,'ceil') }}"

    ################################################################
    # 5. Split the FASTA into N chunks using awk
    ################################################################
    - name: Split the FASTA by sequence
      ansible.builtin.shell: >
        awk -v chunk_size={{ chunk_size }} -v out="{{ chunk_dir }}" '
          BEGIN {
            file_n = 1;
            seq_seen = 0;
          }
          /^>/ {
            seq_seen++;
            # If we exceeded the chunk_size, move to the next chunk
            if (seq_seen > chunk_size) {
              seq_seen=1;
              file_n++;
            }
          }
          {
            outFile = sprintf("%s/chunk_%03d.fasta", out, file_n);
            print >> outFile
          }
        ' {{ dataset_dir }}/uniref50.fasta
      args:
        creates: "{{ chunk_dir }}/chunk_001.fasta"

    ################################################################
    # 6. Compress each chunk
    ################################################################
    - name: Find created chunk files
      ansible.builtin.find:
        paths: "{{ chunk_dir }}"
        patterns: "chunk_*.fasta"
      register: chunk_files

    - name: Compress each chunk
      ansible.builtin.command: pigz -f {{ item.path }}
      loop: "{{ chunk_files.files }}"
      loop_control:
        label: "{{ item.path }}"

    ################################################################
    # 7. Upload chunks to MinIO
    ################################################################
    - name: Find compressed .gz chunk files
      ansible.builtin.find:
        paths: "{{ chunk_dir }}"
        patterns: "chunk_*.fasta.gz"
      register: gz_chunk_files

    - name: Upload compressed chunks to MinIO
      ansible.builtin.shell: >
        {{ minio_bin }} cp
        {{ item.path }}
        {{ minio_alias }}/{{ minio_bucket }}/{{ item.path | basename }}
      loop: "{{ gz_chunk_files.files }}"
      loop_control:
        label: "{{ item.path }}"
