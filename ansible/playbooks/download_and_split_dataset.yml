- name: Download and Split UniRef50 in Background on Worker1
  hosts: worker1
  become: yes
  vars:
    dataset_dir: "/data"
    chunk_dir: "{{ dataset_dir }}/chunks"
    dataset_url: "https://ftp.uniprot.org/pub/databases/uniprot/uniref/uniref50/uniref50.fasta.gz"
    storage_pool_target: "/mnt/data_volume/datasets/internal_chunks"
    chunk_size_mb: 30
    log_file: "/data/uniref_setup.log"

  tasks:
    - name: Install required packages (wget, pigz, coreutils)
      package:
        name:
          - wget
          - pigz
          - coreutils
        state: present
        update_cache: yes

    - name: Ensure dataset, chunk, and storage directories exist
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ dataset_dir }}"
        - "{{ chunk_dir }}"
        - "{{ storage_pool_target }}"

    - name: Start UniRef50 download and preprocessing as background job
      shell: |
        nohup bash -c '
          echo "[START] UniRef50 setup: $(date)"

          if [ ! -f {{ dataset_dir }}/uniref50.fasta ]; then
            if [ ! -f {{ dataset_dir }}/uniref50.fasta.gz ]; then
              echo "[INFO] Downloading UniRef50..."
              wget -O {{ dataset_dir }}/uniref50.fasta.gz {{ dataset_url }}
            fi
            echo "[INFO] Decompressing..."
            pigz -d -f {{ dataset_dir }}/uniref50.fasta.gz
          fi

          if [ ! -f {{ chunk_dir }}/chunk_001.fasta ]; then
            echo "[INFO] Splitting into {{ chunk_size_mb }}MB chunks..."
            split --numeric-suffixes=1 --suffix-length=3 -C {{ chunk_size_mb }}m \
              --additional-suffix=.fasta {{ dataset_dir }}/uniref50.fasta {{ chunk_dir }}/chunk_
            
            echo "[INFO] Renaming chunks..."
            i=1
            for f in {{ chunk_dir }}/chunk_*; do
              mv "$f" "{{ chunk_dir }}/chunk_$(printf "%03d" $i).fasta"
              ((i++))
            done

            echo "[INFO] Compressing chunks..."
            pigz -f {{ chunk_dir }}/chunk_*.fasta

            echo "[INFO] Copying chunks to storage pool..."
            for f in {{ chunk_dir }}/chunk_*.fasta.gz; do
              cp "$f" "{{ storage_pool_target }}/$(basename $f)"
              chown almalinux:almalinux "{{ storage_pool_target }}/$(basename $f)"
              chmod 644 "{{ storage_pool_target }}/$(basename $f)"
            done
          fi

          echo "[COMPLETE] UniRef50 setup finished: $(date)"
        ' > {{ log_file }} 2>&1 &
      async: 1
      poll: 0
