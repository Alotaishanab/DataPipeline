- name: Extreme-Speed Dataset Processing
  hosts: worker1
  become: yes
  become_user: almalinux
  vars:
    dataset_dir: "/mnt/data"
    split_dir: "{{ dataset_dir }}/chunks"
    dataset_url: "https://ftp.uniprot.org/pub/databases/uniprot/uniref/uniref50/uniref50.fasta.gz"
    seqkit_url: "https://github.com/shenwei356/seqkit/releases/download/v2.6.1/seqkit_linux_amd64.tar.gz"

  tasks:
    # Phase 1: System Setup
    - name: Install critical requirements
      become: yes
      become_user: root
      package:
        name:
          - aria2
          - pigz
          - pv
          - rsync
          - tar
        state: present

    # Phase 2: Guaranteed SeqKit Installation
    - name: Install SeqKit (atomic steps)
      block:
        - name: Create temp directory
          file:
            path: /tmp/seqkit_install
            state: directory
            mode: '0755'

        - name: Download SeqKit tarball
          command: aria2c -x 8 -s 16 -q "{{ seqkit_url }}" -d /tmp/seqkit_install -o seqkit.tar.gz
          args:
            creates: /tmp/seqkit_install/seqkit.tar.gz

        - name: Extract binary
          unarchive:
            src: /tmp/seqkit_install/seqkit.tar.gz
            dest: /tmp/seqkit_install
            remote_src: yes

        - name: List files after extraction (debug)
          shell: ls -laR /tmp/seqkit_install
          register: extracted_ls

        - debug:
            msg: "{{ extracted_ls.stdout_lines }}"

        - name: Find actual seqkit binary
          find:
            paths: /tmp/seqkit_install
            patterns: seqkit*
            file_type: file
            recurse: yes
          register: seqkit_found

        - name: Show found files
          debug:
            var: seqkit_found.files

        - name: Move seqkit binary to expected location
          command: mv "{{ item.path }}" /tmp/seqkit_install/seqkit
          loop: "{{ seqkit_found.files }}"
          when: item.path != '/tmp/seqkit_install/seqkit'

        - name: Ensure seqkit binary exists before installing
          stat:
            path: /tmp/seqkit_install/seqkit
          register: seqkit_stat

        - name: Fail if seqkit binary was not found
          fail:
            msg: "Expected binary not found at /tmp/seqkit_install/seqkit"
          when: not seqkit_stat.stat.exists

        - name: Install to system
          copy:
            src: /tmp/seqkit_install/seqkit
            dest: /usr/local/bin/seqkit
            mode: '0755'
            remote_src: yes

        - name: Verify installation
          command: seqkit version
          register: seqkit_check
          changed_when: false

        - name: Cleanup temp files
          file:
            path: /tmp/seqkit_install
            state: absent
      when: '"seqkit" not in command_output'
      vars:
        command_output: "{{ lookup('pipe', 'command -v seqkit || echo missing') }}"

    # Phase 3: Parallel Pipeline (5–7 min)
    - name: Stream download → decompress → split
      shell: |
        aria2c -x 16 -s 32 -q --dir={{ dataset_dir }} "{{ dataset_url }}" -o /dev/stdout |
        pv -petrab -s 14G |
        pigz -cd -p4 |
        seqkit split -p 4 -j4 -O {{ split_dir }} -
      args:
        creates: "{{ split_dir }}/chunk_001.fasta"

    # Phase 4: Fire-and-Forget Distribution (2–3 min)
    - name: Async chunk distribution
      vars:
        target_worker: "worker{{ item }}"
        chunk_number: "00{{ item }}"
      loop: [2,3,4]
      async: 300
      poll: 0
      synchronize:
        src: "{{ split_dir }}/chunk_{{ chunk_number }}.fasta"
        dest: "{{ split_dir }}/"
        rsync_opts:
          - "--compress"
          - "--checksum"
          - "--bwlimit=0"
          - "--partial"
      delegate_to: "{{ target_worker }}"

    # Phase 5: Validation (30 sec)
    - name: Verify processing
      stat:
        path: "{{ split_dir }}/chunk_00{{ item }}.fasta"
      loop: [1,2,3,4]
      register: local_chunks

    - name: Final report
      debug:
        msg: |
          ⚡ PROCESSING COMPLETE ⚡
          Total Time: {{ ansible_date_time.epoch | int - play_started_at | int }} seconds
          Local Chunks: {{ local_chunks.results | selectattr('stat.exists') | list | length }}/4
      vars:
        play_started_at: "{{ ansible_date_time.epoch }}"
