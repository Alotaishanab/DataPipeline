# playbooks/download_and_split_dataset.yml
- name: Dataset Processing Pipeline
  hosts: worker1
  become: yes
  become_user: almalinux
  vars:
    dataset_dir: "/mnt/data"
    split_dir: "{{ dataset_dir }}/chunks"
    dataset_url: "https://ftp.uniprot.org/pub/databases/uniprot/uniref/uniref50/uniref50.fasta.gz"

  tasks:
    # Phase 1: Install Requirements
    - name: Install basic tools
      become: yes
      become_user: root
      package:
        name:
          - wget
          - pigz
          - pv
        state: present

    # Phase 2: Get SeqKit
    - name: Download and install SeqKit
      block:
        - name: Download latest SeqKit
          command: wget https://github.com/shenwei356/seqkit/releases/download/v2.6.1/seqkit_linux_amd64.tar.gz -O /tmp/seqkit.tar.gz
        
        - name: Extract binary
          unarchive:
            src: /tmp/seqkit.tar.gz
            dest: /usr/local/bin
            remote_src: yes
            extra_opts: "--strip-components=1"
            creates: /usr/local/bin/seqkit

        - name: Make executable
          file:
            path: /usr/local/bin/seqkit
            mode: '0755'
      when: not lookup('file', '/usr/local/bin/seqkit', errors='ignore')

    # Phase 3: Handle Dataset
    - name: Create directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ dataset_dir }}"
        - "{{ split_dir }}"

    - name: Download dataset
      command: wget {{ dataset_url }} -O {{ dataset_dir }}/uniref50.fasta.gz
      when: not lookup('file', dataset_dir+'/uniref50.fasta.gz', errors='ignore')

    - name: Decompress dataset
      command: pigz -dk {{ dataset_dir }}/uniref50.fasta.gz
      when: not lookup('file', dataset_dir+'/uniref50.fasta', errors='ignore')

    # Phase 4: Split Dataset
    - name: Split into chunks
      command: seqkit split -p 4 {{ dataset_dir }}/uniref50.fasta -O {{ split_dir }}
      args:
        creates: "{{ split_dir }}/chunk_001.fasta"

    # Phase 5: Distribute
    - name: Copy chunks to workers
      synchronize:
        src: "{{ split_dir }}/chunk_00{{ item }}.fasta"
        dest: "{{ split_dir }}/"
        rsync_opts: "--checksum"
      delegate_to: "worker{{ item }}"
      loop: [2,3,4]