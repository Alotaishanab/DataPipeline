# playbooks/download_and_split_dataset.yml
- name: High-Speed Dataset Processing with Dependency Management
  hosts: worker1
  become: yes
  become_user: almalinux
  vars:
    dataset_dir: "/mnt/data"
    split_dir: "{{ dataset_dir }}/chunks"
    dataset_url: "https://ftp.uniprot.org/pub/databases/uniprot/uniref/uniref50/uniref50.fasta.gz"
    seqkit_version: "2.6.1"
    seqkit_url: "https://github.com/shenwei356/seqkit/releases/download/v{{ seqkit_version }}/seqkit_linux_amd64.tar.gz"

  tasks:
    # Phase 0: Dependency Installation
    - name: Install required system packages
      package:
        name:
          - aria2
          - pigz
          - pv
        state: present

    - name: Install SeqKit binary
      block:
        - name: Download SeqKit
          unarchive:
            src: "{{ seqkit_url }}"
            dest: /tmp/seqkit
            remote_src: yes
            extra_opts: "--strip-components=1"
            creates: /usr/local/bin/seqkit

        - name: Install SeqKit system-wide
          copy:
            src: /tmp/seqkit/seqkit
            dest: /usr/local/bin/seqkit
            mode: '0755'
            remote_src: yes
      when: not lookup('file', '/usr/local/bin/seqkit', errors='ignore')

    # Phase 1: Accelerated Dataset Download
    - name: Check for existing dataset
      stat:
        path: "{{ dataset_dir }}/uniref50.fasta"
      register: dataset_check

    - name: Fast dataset download with aria2
      block:
        - name: Create dataset directory
          file:
            path: "{{ dataset_dir }}"
            state: directory
            mode: '0755'

        - name: Download with aria2 (multi-threaded)
          shell: |
            aria2c -x 16 -s 32 \
              --dir={{ dataset_dir }} \
              --out=uniref50.fasta.gz \
              "{{ dataset_url}}" && \
            pv {{ dataset_dir }}/uniref50.fasta.gz | pigz -cd > {{ dataset_dir }}/uniref50.fasta
          args:
            creates: "{{ dataset_dir }}/uniref50.fasta"
      when: not dataset_check.stat.exists

    # Phase 2: Parallel Processing Pipeline
    - name: Parallel split with progress
      shell: |
        pv -petrab -s $(stat -c%s "{{ dataset_dir }}/uniref50.fasta") "{{ dataset_dir }}/uniref50.fasta" | \
        seqkit split -p 4 -j $(nproc) -O {{ split_dir }} -
      args:
        creates: "{{ split_dir }}/chunk_001.fasta"
      when: not dataset_check.stat.exists

    # Phase 3: Corrected Distribution Section
    - name: Prepare worker directories
      delegate_to: "{{ item }}"
      file:
        path: "{{ split_dir }}"
        state: directory
        mode: '0755'
      loop: "{{ groups['worker_inventory'] }}"
      when: inventory_hostname == "worker1"

    - name: Distribute chunk_002 to worker2
      synchronize:
        src: "{{ split_dir }}/chunk_002.fasta"
        dest: "{{ split_dir }}/"
        rsync_opts:
          - "--compress"
          - "--checksum"
          - "--bwlimit=0"
      delegate_to: worker2
      when: inventory_hostname == "worker1"

    - name: Distribute chunk_003 to worker3
      synchronize:
        src: "{{ split_dir }}/chunk_003.fasta"
        dest: "{{ split_dir }}/"
        rsync_opts:
          - "--compress"
          - "--checksum"
          - "--bwlimit=0"
      delegate_to: worker3
      when: inventory_hostname == "worker1"

    - name: Distribute chunk_004 to worker4
      synchronize:
        src: "{{ split_dir }}/chunk_004.fasta"
        dest: "{{ split_dir }}/"
        rsync_opts:
          - "--compress"
          - "--checksum"
          - "--bwlimit=0"
      delegate_to: worker4
      when: inventory_hostname == "worker1"

    # Phase 4: Validation
    - name: Verify local chunks
      stat:
        path: "{{ split_dir }}/chunk_00{{ item }}.fasta"
      loop: [1,2,3,4]
      register: local_chunks

    - name: Verify remote chunks
      delegate_to: "{{ item }}"
      stat:
        path: "{{ split_dir }}/chunk_00{{ loop.index + 1 }}.fasta"
      loop: ["worker2", "worker3", "worker4"]
      register: remote_chunks

    - name: Final status
      debug:
        msg: |
          ✅ Processing Complete!
          - worker1: {{ split_dir }}/chunk_001.fasta
          - worker2: {{ split_dir }}/chunk_002.fasta {{ '✅' if remote_chunks.results[0].stat.exists else '❌' }}
          - worker3: {{ split_dir }}/chunk_003.fasta {{ '✅' if remote_chunks.results[1].stat.exists else '❌' }}
          - worker4: {{ split_dir }}/chunk_004.fasta {{ '✅' if remote_chunks.results[2].stat.exists else '❌' }}