- name: Extreme-Speed Dataset Processing
  hosts: worker1
  become: yes
  become_user: almalinux
  vars:
    dataset_dir: "/mnt/data"
    split_dir: "{{ dataset_dir }}/chunks"
    dataset_url: "https://ftp.uniprot.org/pub/databases/uniprot/uniref/uniref50/uniref50.fasta.gz"
    seqkit_url: "https://github.com/shenwei356/seqkit/releases/download/v2.6.1/seqkit_linux_amd64.tar.gz"
    chunk_count: 4
    remote_workers:
      - worker2
      - worker3
      - worker4

  tasks:
    # Phase 1: System Setup
    - name: Install critical requirements
      package:
        name:
          - wget
          - pigz
          - pv
          - rsync
          - tar
        state: present

    # Phase 2: SeqKit Installation
    - name: Install SeqKit if not already installed
      block:
        - name: Create temp directory for SeqKit
          file:
            path: /tmp/seqkit_install
            state: directory
            mode: '0755'

        - name: Download SeqKit tarball
          get_url:
            url: "{{ seqkit_url }}"
            dest: /tmp/seqkit_install/seqkit.tar.gz
            mode: '0644'

        - name: Extract SeqKit binary
          unarchive:
            src: /tmp/seqkit_install/seqkit.tar.gz
            dest: /tmp/seqkit_install
            remote_src: yes

        - name: Move SeqKit binary to /usr/local/bin
          command: mv /tmp/seqkit_install/seqkit /usr/local/bin/seqkit
          args:
            creates: /usr/local/bin/seqkit

        - name: Set executable permissions for SeqKit
          file:
            path: /usr/local/bin/seqkit
            mode: '0755'
      when: seqkit_check.rc != 0
      vars:
        seqkit_check:
          rc: "{{ 'seqkit --version' | command | failed | ternary(1, 0) }}"

    # Phase 3: Stream download → decompress → split
    - name: Ensure dataset and split directories exist
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ dataset_dir }}"
        - "{{ split_dir }}"

    - name: Stream download → decompress → split
      shell: |
        wget -qO- "{{ dataset_url }}" |
        pv -petrab -s 14G |
        pigz -cd -p4 |
        seqkit split2 -p {{ chunk_count }} -j 4 -O {{ split_dir }} -
      args:
        creates: "{{ split_dir }}/chunk_001.fasta"

    - name: Compress chunk files
      command: pigz -f {{ split_dir }}/chunk_00{{ item }}.fasta
      loop: "{{ range(1, chunk_count + 1)|list }}"

    # Phase 4: Distribute Chunks to Remote Workers
    - name: Rsync compressed chunks to remote workers
      synchronize:
        src: "{{ split_dir }}/chunk_00{{ item + 1 }}.fasta.gz"
        dest: "{{ split_dir }}/"
        mode: push
      delegate_to: "{{ remote_workers[item] }}"
      loop: "{{ range(chunk_count - 1)|list }}"

    # Phase 5: Decompress Chunks on Remote Workers
    - name: Decompress chunks on remote workers
      command: pigz -d -f {{ split_dir }}/chunk_00{{ item + 1 }}.fasta.gz
      delegate_to: "{{ remote_workers[item] }}"
      loop: "{{ range(chunk_count - 1)|list }}"
