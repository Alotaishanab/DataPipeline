- name: Download and Split UniRef50 on Worker1, then copy chunks to NFS share
  hosts: worker1
  become: yes

  vars:
    dataset_dir: "/mnt/data"
    chunk_dir: "{{ dataset_dir }}/chunks"
    dataset_url: "https://ftp.uniprot.org/pub/databases/uniprot/uniref/uniref50/uniref50.fasta.gz"
    chunk_count: 32
    # nfs_target is the mount point of the NFS share where you want to store the chunks.
    # For example, if your NFS share is mounted on worker1 at /mnt/datasets/uni_chunks, set it here.
    nfs_target: "/mnt/datasets/uni_chunks"

  tasks:
    ################################################################
    # 1. Ensure necessary packages are installed
    ################################################################
    - name: Install required packages (wget and pigz)
      ansible.builtin.package:
        name:
          - wget
          - pigz
        state: present
        update_cache: yes

    ################################################################
    # 2. Create directories for dataset and chunks
    ################################################################
    - name: Ensure dataset and chunk directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ dataset_dir }}"
        - "{{ chunk_dir }}"

    ################################################################
    # 3. Download and decompress the UniRef50 FASTA
    ################################################################
    - name: Download UniRef50 FASTA (compressed)
      ansible.builtin.command: >
        wget -O {{ dataset_dir }}/uniref50.fasta.gz {{ dataset_url }}
      args:
        creates: "{{ dataset_dir }}/uniref50.fasta.gz"

    - name: Decompress the FASTA using pigz
      ansible.builtin.command: >
        pigz -d -f {{ dataset_dir }}/uniref50.fasta.gz
      args:
        removes: "{{ dataset_dir }}/uniref50.fasta.gz"
        creates: "{{ dataset_dir }}/uniref50.fasta"

    ################################################################
    # 4. Count sequences and calculate chunk size
    ################################################################
    - name: Count how many sequences are in the FASTA
      ansible.builtin.shell: "grep '^>' {{ dataset_dir }}/uniref50.fasta | wc -l"
      register: seq_count

    - name: Calculate number of sequences per chunk
      set_fact:
        chunk_size: "{{ (seq_count.stdout|int / chunk_count) | round(0, 'ceil') }}"

    ################################################################
    # 5. Split the FASTA into N chunks using awk
    ################################################################
    - name: Split the FASTA by sequence using awk
      ansible.builtin.shell: >
        awk -v chunk_size={{ chunk_size }} -v out="{{ chunk_dir }}" '
          BEGIN { file_n = 1; seq_seen = 0; }
          /^>/ { seq_seen++; if (seq_seen > chunk_size) { seq_seen=1; file_n++; } }
          { outFile = sprintf("%s/chunk_%03d.fasta", out, file_n); print >> outFile; }
        ' {{ dataset_dir }}/uniref50.fasta
      args:
        creates: "{{ chunk_dir }}/chunk_001.fasta"

    ################################################################
    # 6. Compress each chunk using pigz
    ################################################################
    - name: Find created chunk files
      ansible.builtin.find:
        paths: "{{ chunk_dir }}"
        patterns: "chunk_*.fasta"
      register: chunk_files

    - name: Compress each chunk with pigz
      ansible.builtin.command: pigz -f {{ item.path }}
      loop: "{{ chunk_files.files }}"
      loop_control:
        label: "{{ item.path }}"

    ################################################################
    # 7. Copy compressed chunks to the NFS share
    ################################################################
    - name: Ensure target NFS directory exists
      ansible.builtin.file:
        path: "{{ nfs_target }}"
        state: directory
        mode: '0755'

    - name: Find compressed chunk files
      ansible.builtin.find:
        paths: "{{ chunk_dir }}"
        patterns: "chunk_*.fasta.gz"
      register: gz_chunk_files

    - name: Copy each compressed chunk to the NFS share
      ansible.builtin.command: cp {{ item.path }} {{ nfs_target }}/{{ item.path | basename }}
      loop: "{{ gz_chunk_files.files }}"
      loop_control:
        label: "{{ item.path }}"
