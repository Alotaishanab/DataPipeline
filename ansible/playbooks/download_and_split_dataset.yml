- name: Download and Split UniRef50 on Worker1, then copy chunks to Storage Pool
  hosts: worker1
  become: yes
  vars:
    dataset_dir: "/data"
    chunk_dir: "{{ dataset_dir }}/chunks"
    dataset_url: "https://ftp.uniprot.org/pub/databases/uniprot/uniref/uniref50/uniref50.fasta.gz"
    storage_pool_target: "/mnt/data_volume/datasets/internal_chunks"
    chunk_size_mb: 256

  tasks:
    - name: Install required packages (wget, pigz, coreutils)
      package:
        name:
          - wget
          - pigz
          - coreutils
        state: present
        update_cache: yes

    - name: Ensure dataset and chunk directories exist
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ dataset_dir }}"
        - "{{ chunk_dir }}"

    - name: Check if UniRef50 FASTA dataset is already present (decompressed)
      stat:
        path: "{{ dataset_dir }}/uniref50.fasta"
      register: uniref_dataset

    - name: Download UniRef50 FASTA (compressed)
      command: >
        wget -O {{ dataset_dir }}/uniref50.fasta.gz {{ dataset_url }}
      args:
        creates: "{{ dataset_dir }}/uniref50.fasta.gz"
      when: not uniref_dataset.stat.exists

    - name: Decompress the FASTA using pigz
      command: >
        pigz -d -f {{ dataset_dir }}/uniref50.fasta.gz
      args:
        removes: "{{ dataset_dir }}/uniref50.fasta.gz"
        creates: "{{ dataset_dir }}/uniref50.fasta"
      when: not uniref_dataset.stat.exists

    - name: Check if splitting has already been done
      stat:
        path: "{{ chunk_dir }}/chunk_001.fasta"
      register: chunk_check

    - name: Split FASTA file into size-based chunks (~{{ chunk_size_mb }}M each)
      shell: >
        split --numeric-suffixes=1 --suffix-length=3 -C {{ chunk_size_mb }}m \
        --additional-suffix=.fasta {{ dataset_dir }}/uniref50.fasta {{ chunk_dir }}/chunk_
      args:
        creates: "{{ chunk_dir }}/chunk_001.fasta"
      when: not chunk_check.stat.exists

    - name: Rename chunk files to standard names (chunk_###.fasta)
      shell: |
        i=1
        for f in {{ chunk_dir }}/chunk_*; do
          mv "$f" "{{ chunk_dir }}/chunk_$(printf '%03d' $i).fasta"
          ((i++))
        done
      args:
        executable: /bin/bash
      when: not chunk_check.stat.exists

    - name: Find created chunk files
      find:
        paths: "{{ chunk_dir }}"
        patterns: "chunk_*.fasta"
      register: chunk_files

    - name: Compress each chunk with pigz
      command: pigz -f {{ item.path }}
      loop: "{{ chunk_files.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Ensure target Storage Pool directory exists
      file:
        path: "{{ storage_pool_target }}"
        state: directory
        mode: '0775'

    - name: Set ownership to almalinux on Storage Pool target
      file:
        path: "{{ storage_pool_target }}"
        owner: almalinux
        group: almalinux
        recurse: yes

    - name: Find compressed chunk files
      find:
        paths: "{{ chunk_dir }}"
        patterns: "chunk_*.fasta.gz"
      register: gz_chunk_files

    - name: Copy each compressed chunk to the Storage Pool
      copy:
        src: "{{ item.path }}"
        dest: "{{ storage_pool_target }}/{{ item.path | basename }}"
        remote_src: yes
        owner: almalinux
        group: almalinux
        mode: '0644'
      loop: "{{ gz_chunk_files.files }}"
      loop_control:
        label: "{{ item.path }}"
