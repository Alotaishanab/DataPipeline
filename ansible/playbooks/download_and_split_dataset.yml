- name: Prepare and Test FASTA Chunk Processing on Worker1
  hosts: worker1
  become: yes
  vars:
    dataset_dir: "/data"
    chunk_dir: "{{ dataset_dir }}/chunks"
    dataset_url: "https://ftp.uniprot.org/pub/databases/uniprot/uniref/uniref50/uniref50.fasta.gz"
    storage_pool_target: "/mnt/data_volume/datasets/internal_chunks"
    chunk_size_mb: 256
    test_chunk_dir: "/data/test_chunks"
    num_chunks: 6
    seq_per_file: 5
    seq_length: 200

  tasks:
    - name: Install required packages (wget, pigz, coreutils)
      package:
        name:
          - wget
          - pigz
          - coreutils
        state: present
        update_cache: yes

    - name: Ensure dataset, chunk, and test directories exist
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ dataset_dir }}"
        - "{{ chunk_dir }}"
        - "{{ test_chunk_dir }}"
        - "{{ storage_pool_target }}"

    #####################################################################
    ## COMMENTED OUT: UniRef50 Download + Splitting Logic
    #####################################################################
    # (unchanged; safe to leave commented)

    #####################################################################
    ## ✅ TEST CHUNK GENERATION INSTEAD
    #####################################################################

    - name: Ensure biopython is installed
      pip:
        name: biopython
        virtualenv: /opt/esm/venv
        state: present

    - name: Generate synthetic small FASTA files
      copy:
        dest: "{{ test_chunk_dir }}/generate_fasta.py"
        content: |
          import os
          import random
          from Bio.Seq import Seq
          from Bio.SeqRecord import SeqRecord
          from Bio import SeqIO

          aa = "ACDEFGHIKLMNPQRSTVWY"
          os.makedirs("{{ test_chunk_dir }}", exist_ok=True)

          for idx in range(1, {{ num_chunks }} + 1):
              records = []
              for j in range({{ seq_per_file }}):
                  sequence = ''.join(random.choices(aa, k={{ seq_length }}))
                  records.append(SeqRecord(Seq(sequence), id=f"test_{idx}_{j}", description=""))

              outpath = os.path.join("{{ test_chunk_dir }}", f"chunk_{idx:03d}.fasta")
              with open(outpath, "w") as out:
                  SeqIO.write(records, out, "fasta")

    - name: Run FASTA generation script
      command: /opt/esm/venv/bin/python3 {{ test_chunk_dir }}/generate_fasta.py
      args:
        creates: "{{ test_chunk_dir }}/chunk_006.fasta"

    - name: Find generated test FASTA files
      find:
        paths: "{{ test_chunk_dir }}"
        patterns: "chunk_*.fasta"
      register: test_fasta_files

    - name: Compress each test chunk
      command: pigz -f {{ item.path }}
      loop: "{{ test_fasta_files.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Copy test chunks to storage pool
      copy:
        src: "{{ item.path | regex_replace('\\.fasta$', '.fasta.gz') }}"
        dest: "{{ storage_pool_target }}/{{ item.path | basename | regex_replace('\\.fasta$', '.fasta.gz') }}"
        remote_src: yes
        owner: almalinux
        group: almalinux
        mode: '0644'
      loop: "{{ test_fasta_files.files }}"
      loop_control:
        label: "{{ item.path }}"
