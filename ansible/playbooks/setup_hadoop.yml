---
- name: Finalize Hadoop Setup on Management Node (Preserve HDFS Data)
  hosts: localhost
  become: yes
  become_user: almalinux
  vars:
    hadoop_home: "/home/almalinux/hadoop-3.4.0"
  tasks:
    - name: Stop existing NameNode if running
      shell: |
        if [ -f /tmp/hadoop-almalinux-namenode.pid ]; then
          kill -9 $(cat /tmp/hadoop-almalinux-namenode.pid) || true
          rm -f /tmp/hadoop-almalinux-namenode.pid
        fi
      args:
        executable: /bin/bash
      ignore_errors: true

    - name: Ensure NameNode PID file is removed
      file:
        path: /tmp/hadoop-almalinux-namenode.pid
        state: absent

    - name: Format Hadoop cluster (namenode)
      shell: "{{ hadoop_home }}/bin/hdfs namenode -format -force"
      args:
        chdir: "{{ hadoop_home }}"
      environment:
        JAVA_HOME: "/usr/lib/jvm/java-11-openjdk"
        PATH: "{{ hadoop_home }}/bin:{{ ansible_env.PATH }}"

    - name: Restart NameNode
      shell: "nohup {{ hadoop_home }}/bin/hdfs namenode > /tmp/namenode.log 2>&1 &"
      args:
        chdir: "{{ hadoop_home }}"
      environment:
        JAVA_HOME: "/usr/lib/jvm/java-11-openjdk"
        PATH: "{{ hadoop_home }}/bin:{{ ansible_env.PATH }}"

    - name: Restart DataNode on Management Node (if applicable)
      shell: "nohup {{ hadoop_home }}/bin/hdfs datanode > /tmp/datanode.log 2>&1 &"
      args:
        chdir: "{{ hadoop_home }}"
      environment:
        JAVA_HOME: "/usr/lib/jvm/java-11-openjdk"
        PATH: "{{ hadoop_home }}/bin:{{ ansible_env.PATH }}"

    - name: Restart YARN ResourceManager
      shell: "nohup {{ hadoop_home }}/bin/yarn resourcemanager > /tmp/resourcemanager.log 2>&1 &"
      args:
        chdir: "{{ hadoop_home }}"
      environment:
        JAVA_HOME: "/usr/lib/jvm/java-11-openjdk"
        PATH: "{{ hadoop_home }}/bin:{{ ansible_env.PATH }}"

- name: Restart Hadoop Services on Worker Nodes (Preserve HDFS Data)
  hosts: worker_inventory
  become: yes
  become_user: almalinux
  vars:
    hadoop_home: "/home/almalinux/hadoop-3.4.0"
    java_home: "/usr/lib/jvm/java-11-openjdk"
  tasks:
    - name: Stop any old DataNode processes
      shell: "pkill -f 'hdfs datanode' || true"
      ignore_errors: true

    # Do not wipe out the DataNode data directory; ensure it exists instead.
    - name: Ensure DataNode directory exists
      file:
        path: /mnt/data/hdfs/datanode
        state: directory
        owner: almalinux
        group: almalinux
        mode: '0755'

    - name: Restart DataNode on Worker Node
      shell: "nohup {{ hadoop_home }}/bin/hdfs datanode > /tmp/datanode.log 2>&1 &"
      args:
        chdir: "{{ hadoop_home }}"
      environment:
        JAVA_HOME: "{{ java_home }}"
        PATH: "{{ hadoop_home }}/bin:{{ ansible_env.PATH }}"

    - name: Restart YARN NodeManager on Worker Node
      shell: "nohup {{ hadoop_home }}/bin/yarn nodemanager > /tmp/nodemanager.log 2>&1 &"
      args:
        chdir: "{{ hadoop_home }}"
      environment:
        JAVA_HOME: "{{ java_home }}"
        PATH: "{{ hadoop_home }}/bin:{{ ansible_env.PATH }}"
