- name: Finalise Hadoop Setup on Management Node
  hosts: localhost
  become: true
  become_user: almalinux
  vars:
    hadoop_home: "/home/almalinux/hadoop-3.4.0"
  tasks:

    - name: Ensure Hadoop logs directory exists and is writable
      ansible.builtin.file:
        path: "{{ hadoop_home }}/logs"
        state: directory
        owner: almalinux
        group: almalinux
        mode: '0755'

    - name: Format Hadoop cluster (namenode)
      ansible.builtin.shell: "{{ hadoop_home }}/bin/hdfs namenode -format -force"
      args:
        chdir: "{{ hadoop_home }}"
      environment:
        JAVA_HOME: "/usr/lib/jvm/java-11-openjdk"
        PATH: "{{ hadoop_home }}/bin:{{ ansible_env.PATH }}"

    - name: Start NameNode directly (no SSH)
      ansible.builtin.shell: "nohup {{ hadoop_home }}/bin/hdfs namenode > /tmp/namenode.log 2>&1 &"
      args:
        chdir: "{{ hadoop_home }}"
      environment:
        JAVA_HOME: "/usr/lib/jvm/java-11-openjdk"
        PATH: "{{ hadoop_home }}/bin:{{ ansible_env.PATH }}"

    - name: Start DataNode directly (no SSH)
      ansible.builtin.shell: "nohup {{ hadoop_home }}/bin/hdfs datanode > /tmp/datanode.log 2>&1 &"
      args:
        chdir: "{{ hadoop_home }}"
      environment:
        JAVA_HOME: "/usr/lib/jvm/java-11-openjdk"
        PATH: "{{ hadoop_home }}/bin:{{ ansible_env.PATH }}"

