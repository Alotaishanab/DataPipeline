- name: Setup Flask Upload App and Expose Results via Apache
  hosts: localhost
  become: yes

  vars:
    flask_app_path: /opt/data_pipeline/flask_server.py     
    flask_app_port: 8080
    flask_work_dir: /opt/data_pipeline
    results_path: /mnt/results

  tasks:
    - name: Install Flask for Upload App
      pip:
        name:
          - flask
          - flask_cors
        state: present

    - name: Ensure base working directory exists
      file:
        path: "{{ flask_work_dir }}"
        state: directory
        owner: almalinux
        group: almalinux
        mode: '0755'

    - name: Ensure upload directory exists
      file:
        path: /mnt/data_volume/uploads
        state: directory
        owner: almalinux
        group: almalinux
        mode: '0775'

    - name: Copy flask_server.py Flask app
      copy:
        src: ../../backend/flask_server.py
        dest: "{{ flask_app_path }}"
        mode: '0755'
        owner: almalinux
        group: almalinux
      notify: restart_flask_upload_app

    - name: Copy split_uploaded_fasta.py script
      copy:
        src: ../../backend/split_uploaded_fasta.py
        dest: "{{ flask_work_dir }}/split_uploaded_fasta.py"
        mode: '0755'
        owner: almalinux
        group: almalinux


    - name: Create systemd service for Flask Upload App
      copy:
        dest: /etc/systemd/system/flask_upload_ui.service
        mode: '0644'
        content: |
          [Unit]
          Description=Flask Upload UI
          After=network.target

          [Service]
          Type=simple
          User=almalinux
          Group=almalinux
          WorkingDirectory={{ flask_work_dir }}
          ExecStart=/usr/bin/python3 {{ flask_app_path }}
          Restart=always

          [Install]
          WantedBy=multi-user.target
      notify: restart_flask_upload_app

    - name: Configure Apache reverse proxy for Flask
      copy:
        dest: /etc/httpd/conf.d/react_flask_proxy.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          <VirtualHost *:80>
            ServerName your.hostname.com

            ProxyPreserveHost On

            # Allow very large uploads (0 = unlimited; set explicit
            # byte value if you want a hard cap, e.g. 2147483648 for 2 GB)

            LimitRequestBody 0
            ProxyTimeout 600
          

            ProxyPass /upload http://127.0.0.1:8080/upload
            ProxyPassReverse /upload http://127.0.0.1:8080/upload

            ProxyPass /api/ http://127.0.0.1:8080/api/
            ProxyPassReverse /api/ http://127.0.0.1:8080/api/

            ProxyPass /datasets/ http://127.0.0.1:8080/datasets/
            ProxyPassReverse /datasets/ http://127.0.0.1:8080/datasets/

            ProxyPass /results/ http://127.0.0.1:8080/results/
            ProxyPassReverse /results/ http://127.0.0.1:8080/results/

            DocumentRoot /var/www/html
            <Directory /var/www/html>
                Options Indexes FollowSymLinks
                AllowOverride All
                Require all granted
            </Directory>
          </VirtualHost>
      notify: restart_httpd

    - name: Start and enable Flask Upload UI
      systemd:
        name: flask_upload_ui
        state: started
        enabled: yes

  handlers:
    - name: restart_flask_upload_app
      systemd:
        name: flask_upload_ui
        state: restarted

    - name: restart_httpd
      systemd:
        name: httpd
        state: restarted