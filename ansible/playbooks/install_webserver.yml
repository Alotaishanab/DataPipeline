- name: Setup Flask Upload App and Expose Results via Apache
  hosts: localhost
  become: yes

  vars:
    flask_app_path: /opt/data_pipeline/upload_dataset.py
    flask_app_port: 8080
    flask_work_dir: /opt/data_pipeline
    results_path: /mnt/results

  tasks:

    - name: Install Apache httpd
      yum:
        name: httpd
        state: present

    - name: Start and enable Apache httpd
      systemd:
        name: httpd
        state: started
        enabled: yes

    - name: Install Flask for Upload App
      pip:
        name:
          - flask
          - flask_cors
        state: present

    - name: Ensure base working directory exists
      file:
        path: "{{ flask_work_dir }}"
        state: directory
        owner: almalinux
        group: almalinux
        mode: '0755'

    - name: Ensure upload directory exists
      file:
        path: /mnt/uploads
        state: directory
        owner: almalinux
        group: almalinux
        mode: '0775'

    - name: Copy upload_dataset.py Flask app
      copy:
        src: ../scripts/upload_dataset.py
        dest: "{{ flask_app_path }}"
        mode: '0755'
        owner: almalinux
        group: almalinux
      notify: restart_flask_upload_app

    - name: Create systemd service for Flask Upload App
      copy:
        dest: /etc/systemd/system/flask_upload_ui.service
        mode: '0644'
        content: |
          [Unit]
          Description=Flask Upload UI
          After=network.target

          [Service]
          Type=simple
          User=almalinux
          Group=almalinux
          WorkingDirectory={{ flask_work_dir }}
          ExecStart=/usr/bin/python3 {{ flask_app_path }}
          Restart=always

          [Install]
          WantedBy=multi-user.target
      notify: restart_flask_upload_app

    - name: Start and enable Flask Upload UI
      systemd:
        name: flask_upload_ui
        state: started
        enabled: yes

  handlers:
    - name: restart_flask_upload_app
      systemd:
        name: flask_upload_ui
        state: restarted

    - name: restart_httpd
      systemd:
        name: httpd
        state: restarted
