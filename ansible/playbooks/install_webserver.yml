- name: Deploy Flask Upload UI
  hosts: localhost
  become: yes
  vars:
    flask_ui_dir: /opt/data_pipeline/ui
    flask_ui_script: /opt/data_pipeline/ui/upload_dataset.py
    flask_ui_port: 8080

  tasks:
    - name: Install Flask and dependencies
      pip:
        name:
          - flask
          - flask_cors
        state: present

    - name: Ensure /mnt/uploads exists and is owned by almalinux
      ansible.builtin.file:
        path: /mnt/uploads
        state: directory
        owner: almalinux
        group: almalinux
        mode: '0775'

    - name: Ensure /opt/data_pipeline directory exists
      file:
        path: /opt/data_pipeline
        state: directory
        owner: almalinux
        group: almalinux
        mode: '0755'

    - name: Create Flask UI directory
      file:
        path: "{{ flask_ui_dir }}"
        state: directory
        owner: almalinux
        group: almalinux
        mode: '0755'

    - name: Deploy upload_dataset.py
      copy:
        src: ../scripts/upload_dataset.py
        dest: "{{ flask_ui_script }}"
        mode: '0755'
        owner: almalinux
        group: almalinux
      notify: restart_flask_ui

    - name: Create systemd service for Flask UI
      copy:
        dest: /etc/systemd/system/flask_upload_ui.service
        mode: '0644'
        content: |
          [Unit]
          Description=Flask Upload UI
          After=network.target

          [Service]
          Type=simple
          User=almalinux
          Group=almalinux
          WorkingDirectory={{ flask_ui_dir }}
          ExecStart=/usr/bin/python3 {{ flask_ui_script }}
          Restart=always

          [Install]
          WantedBy=multi-user.target
      notify: restart_flask_ui

    - name: Start and enable Flask Upload UI
      systemd:
        name: flask_upload_ui
        state: started
        enabled: yes

    - name: Force restart Flask Upload UI every time
      systemd:
        name: flask_upload_ui
        state: restarted

    - name: Install Apache httpd
      yum:
        name: httpd
        state: present

    - name: Start and enable Apache httpd
      systemd:
        name: httpd
        state: started
        enabled: yes

    - name: Create Apache proxy config for Flask UI
      copy:
        dest: /etc/httpd/conf.d/flask_ui_proxy.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          <VirtualHost *:80>
              ServerName localhost
              ProxyPreserveHost On
              ProxyPass / http://127.0.0.1:8080/
              ProxyPassReverse / http://127.0.0.1:8080/
          </VirtualHost>
      notify: restart_httpd

    - name: Allow port 80 in firewalld
      firewalld:
        port: 80/tcp
        permanent: yes
        state: enabled
        immediate: yes
      when: ansible_service_mgr == 'systemd'

    - name: Reload firewalld for HTTP
      service:
        name: firewalld
        state: reloaded
      when: ansible_service_mgr == 'systemd'

  handlers:
    - name: restart_httpd
      systemd:
        name: httpd
        state: restarted

    - name: restart_flask_ui
      systemd:
        name: flask_upload_ui
        state: restarted
