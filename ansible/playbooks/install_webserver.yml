- name: Deploy Flask Upload UI
  hosts: localhost
  become: yes
  vars:
    flask_ui_dir: /opt/data_pipeline/ui
    flask_ui_script: /opt/data_pipeline/ui/upload_dataset.py
    flask_ui_port: 8080

  tasks:
    - name: Install Flask and dependencies
      pip:
        name:
          - flask
          - flask_cors
        state: present

    - name: Create Flask UI directory
      file:
        path: "{{ flask_ui_dir }}"
        state: directory
        owner: almalinux
        group: almalinux
        mode: '0755'

    - name: Deploy upload_dataset.py
      copy:
        src: ../scripts/upload_dataset.py
        dest: "{{ flask_ui_script }}"
        mode: '0755'
        owner: almalinux
        group: almalinux

    - name: Create systemd service for Flask UI
      copy:
        dest: /etc/systemd/system/flask_upload_ui.service
        mode: '0644'
        content: |
          [Unit]
          Description=Flask Upload UI
          After=network.target

          [Service]
          Type=simple
          User=almalinux
          WorkingDirectory={{ flask_ui_dir }}
          ExecStart=/usr/bin/python3 {{ flask_ui_script }}
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Start and enable Flask Upload UI
      systemd:
        name: flask_upload_ui
        state: started
        enabled: yes

    - name: Allow port 8080 in firewalld for UI
      firewalld:
        port: 8080/tcp
        permanent: yes
        state: enabled
        immediate: yes
      when: ansible_service_mgr == 'systemd'

    - name: Reload firewalld for UI
      service:
        name: firewalld
        state: reloaded
      when: ansible_service_mgr == 'systemd'
