- name: Deploy Flask Upload UI
  hosts: host
  become: yes
  vars:
    flask_ui_dir: /opt/data_pipeline/ui
    flask_ui_script: /opt/data_pipeline/ui/upload_ui.py
    flask_ui_port: 8080

  tasks:
    - name: Install Flask and dependencies
      pip:
        name:
          - flask
          - flask_cors
        state: present

    - name: Create Flask UI directory
      file:
        path: "{{ flask_ui_dir }}"
        state: directory
        owner: almalinux
        group: almalinux
        mode: '0755'

    - name: Deploy upload_ui.py
      copy:
        dest: "{{ flask_ui_script }}"
        mode: '0755'
        content: |
          from flask import Flask, request, render_template_string, redirect, url_for
          import os
          from werkzeug.utils import secure_filename

          app = Flask(__name__)
          UPLOAD_FOLDER = '/mnt/uploads'
          app.config['UPLOAD_FOLDER'] = UPLOAD_FOLDER

          os.makedirs(UPLOAD_FOLDER, exist_ok=True)

          HTML_TEMPLATE = '''
          <!DOCTYPE html>
          <html>
          <head>
            <title>Upload Dataset</title>
            <style>
              body { font-family: sans-serif; background: #f7f8fa; margin: 0; padding: 0; }
              .container { max-width: 500px; margin: 80px auto; background: white; padding: 40px; box-shadow: 0 0 12px rgba(0,0,0,0.1); border-radius: 12px; }
              h2 { color: #111; }
              input[type=file] { width: 100%; padding: 10px; }
              input[type=submit] { margin-top: 20px; background: #0053f0; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
              .status { margin-top: 20px; color: green; font-weight: bold; }
            </style>
          </head>
          <body>
            <div class="container">
              <h2>Upload Your Dataset</h2>
              <form method="POST" enctype="multipart/form-data">
                <input type="file" name="file">
                <input type="submit" value="Upload">
              </form>
              {% if filename %}
              <div class="status">Uploaded: {{ filename }}</div>
              {% endif %}
            </div>
          </body>
          </html>'''

          @app.route('/', methods=['GET', 'POST'])
          def upload():
              filename = None
              if request.method == 'POST':
                  f = request.files['file']
                  if f:
                      filename = secure_filename(f.filename)
                      f.save(os.path.join(app.config['UPLOAD_FOLDER'], filename))
              return render_template_string(HTML_TEMPLATE, filename=filename)

          if __name__ == '__main__':
              app.run(host='0.0.0.0', port={{ flask_ui_port }})

    - name: Create systemd service for Flask UI
      copy:
        dest: /etc/systemd/system/flask_upload_ui.service
        mode: '0644'
        content: |
          [Unit]
          Description=Flask Upload UI
          After=network.target

          [Service]
          Type=simple
          User=almalinux
          WorkingDirectory={{ flask_ui_dir }}
          ExecStart=/usr/bin/python3 {{ flask_ui_script }}
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Start and enable Flask Upload UI
      systemd:
        name: flask_upload_ui
        state: started
        enabled: yes

    - name: Allow port 8080 in firewalld for UI
      firewalld:
        port: 8080/tcp
        permanent: yes
        state: enabled
        immediate: yes
      when: ansible_service_mgr == 'systemd'

    - name: Reload firewalld for UI
      service:
        name: firewalld
        state: reloaded
      when: ansible_service_mgr == 'systemd'
