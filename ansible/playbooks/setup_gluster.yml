---
# Play 1: Install GlusterFS server and prepare Gluster brick directories
- name: Prepare Worker Nodes for GlusterFS
  hosts: worker_inventory
  become: yes
  gather_facts: yes
  vars:
    brick_dir: "/data/gluster/brick1"
  tasks:
    - name: Install EPEL repository
      yum:
        name: epel-release
        state: present

    - name: Add CentOS Gluster 11 repository
      yum:
        name: centos-release-gluster11
        state: present
      when: ansible_distribution_major_version | int == 9

    - name: Disable centos-gluster11 globally after install
      command: dnf config-manager --set-disabled centos-gluster11
      changed_when: false
      when: ansible_distribution_major_version | int == 9

    - name: Install glusterfs-server from CentOS Gluster 11 repo
      yum:
        name: glusterfs-server
        state: present
        enablerepo: centos-gluster11

    - name: Start and enable glusterd
      systemd:
        name: glusterd
        state: started
        enabled: yes

    - name: Open GlusterFS ports in firewall
      firewalld:
        port: "{{ item }}/tcp"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - 24007
        - 24008
        - 49152-49251

    - name: Enable and start firewalld
      systemd:
        name: firewalld
        state: started
        enabled: yes

    - name: Create GlusterFS brick directory under /data
      file:
        path: "{{ brick_dir }}"
        state: directory
        mode: '0755'

# Play 2: Configure GlusterFS volume from master node
- name: Configure GlusterFS volume
  hosts: worker1
  become: yes
  gather_facts: yes
  vars:
    volume_name: "data_volume"
    brick_path: "/data/gluster/brick1"
  tasks:
    - name: Probe GlusterFS peers using IPs (avoids hostname issues)
      shell: "gluster peer probe {{ hostvars[item].ansible_host }}"
      loop: "{{ groups['worker_inventory'] | difference(['worker1']) }}"
      loop_control:
        label: "{{ hostvars[item].ansible_host }}"
      ignore_errors: true

    - name: Wait for peer connections
      pause:
        seconds: 10

    - name: Check if GlusterFS volume already exists
      shell: "gluster volume info {{ volume_name }}"
      register: volume_check
      changed_when: false
      failed_when: false

    - name: Create GlusterFS distributed volume (if not exists)
      shell: >
        gluster volume create {{ volume_name }}
        {{ groups['worker_inventory']
            | map('extract', hostvars, 'ansible_host')
            | map('regex_replace', '$', ':' ~ brick_path)
            | join(' ') }} force
      when: volume_check.rc != 0
      register: volume_create
      changed_when: "'Volume create' in volume_create.stdout"

    - name: Ensure GlusterFS volume is started
      shell: gluster volume start {{ volume_name }}
      when: volume_check.rc != 0 or (volume_create is defined and volume_create.changed)

# Play 3: Mount GlusterFS volume on localhost
- name: Mount GlusterFS volume on localhost
  hosts: localhost
  become: yes
  gather_facts: yes
  vars:
    mount_dir: "/mnt/data_volume"
    volume_name: "data_volume"
    gluster_server: "{{ hostvars[groups['worker_inventory'][0]].ansible_host }}"
  tasks:
    - name: Add CentOS Gluster 11 repository (if needed)
      yum:
        name: centos-release-gluster11
        state: present
      when: ansible_distribution_major_version | int == 9

    - name: Install GlusterFS client (glusterfs-fuse)
      yum:
        name: glusterfs-fuse
        state: present
        enablerepo: centos-gluster11

    - name: Check if mount point is valid directory
      stat:
        path: "{{ mount_dir }}"
      register: mount_stat

    - name: Remove invalid file at mount point path
      file:
        path: "{{ mount_dir }}"
        state: absent
      when: mount_stat.stat.exists and not mount_stat.stat.isdir

    - name: Create mount point directory
      file:
        path: "{{ mount_dir }}"
        state: directory
        mode: '0755'

    - name: Mount GlusterFS volume
      mount:
        path: "{{ mount_dir }}"
        src: "{{ gluster_server }}:{{ volume_name }}"
        fstype: glusterfs
        opts: defaults
        state: mounted
