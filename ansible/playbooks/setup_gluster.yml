---
# Play 1: Prepare Worker Nodes for GlusterFS
- name: Prepare Worker Nodes for GlusterFS
  hosts: worker_inventory
  become: yes
  gather_facts: yes
  vars:
    brick_dir: "/data/gluster/brick1"

  tasks:
    - name: Install required packages
      yum:
        name:
          - epel-release
          - firewalld
        state: present

    - name: Add CentOS Gluster 11 repository
      yum:
        name: centos-release-gluster11
        state: present
      when: ansible_distribution_major_version | int == 9

    - name: Disable centos-gluster11 repo (post-install)
      command: dnf config-manager --set-disabled centos-gluster11
      changed_when: false
      when: ansible_distribution_major_version | int == 9

    - name: Install glusterfs-server
      yum:
        name: glusterfs-server
        state: present
        enablerepo: centos-gluster11

    - name: Enable and start glusterd
      systemd:
        name: glusterd
        state: started
        enabled: yes

    - name: Set SELinux boolean for GlusterFS
      seboolean:
        name: use_nfs_home_dirs
        state: yes
        persistent: yes

    - name: Open GlusterFS ports in firewall
      firewalld:
        port: "{{ item }}/tcp"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - 24007
        - 24008
        - 49152-49251

    - name: Enable and start firewalld
      systemd:
        name: firewalld
        state: started
        enabled: yes

    - name: Create GlusterFS brick directory
      file:
        path: "{{ brick_dir }}"
        state: directory
        mode: '0755'

# Play 2: Configure GlusterFS volume from worker1
- name: Configure GlusterFS volume
  hosts: worker1
  become: yes
  gather_facts: yes
  vars:
    volume_name: "data_volume"
    brick_path: "/data/gluster/brick1"

  tasks:
    - name: Probe GlusterFS peers using IPs
      shell: "gluster peer probe {{ hostvars[item].ansible_host }}"
      loop: "{{ groups['worker_inventory'] | difference(['worker1']) }}"
      loop_control:
        label: "{{ hostvars[item].ansible_host }}"
      ignore_errors: true

    - name: Wait for peer connections
      pause:
        seconds: 10

    - name: Re-check volume existence with full status
      shell: "gluster volume info {{ volume_name }}"
      register: volume_check
      changed_when: false
      failed_when: false

    - name: Create GlusterFS volume if needed
      shell: >
        gluster volume create {{ volume_name }}
        {{ groups['worker_inventory']
            | map('extract', hostvars, 'ansible_host')
            | map('regex_replace', '$', ':' ~ brick_path)
            | join(' ') }} force
      when: volume_check.rc != 0
      register: volume_create
      changed_when: "'Volume create' in volume_create.stdout"

    - name: Start GlusterFS volume
      shell: gluster volume start {{ volume_name }}
      when: volume_check.rc != 0 or (volume_create is defined and volume_create.changed)

# Play 3: Mount GlusterFS volume on mgmt node
- name: Mount GlusterFS volume on mgmt node
  hosts: localhost
  become: yes
  gather_facts: yes
  vars:
    mount_dir: "/mnt/data_volume"
    volume_name: "data_volume"
    gluster_server: "{{ hostvars[groups['worker_inventory'][0]].ansible_host }}"

  tasks:
    - name: Add CentOS Gluster 11 repository (if needed)
      yum:
        name: centos-release-gluster11
        state: present
      when: ansible_distribution_major_version | int == 9

    - name: Install GlusterFS client
      yum:
        name: glusterfs-fuse
        state: present
        enablerepo: centos-gluster11

    - name: Check if GlusterFS mount point is broken
      shell: |
        mount | grep -q "{{ mount_dir }}" && mountpoint -q {{ mount_dir }} || echo "broken"
      register: mount_status
      changed_when: false
      failed_when: false

    - name: Force unmount GlusterFS volume if broken
      shell: "umount -lf {{ mount_dir }}"
      when: "'broken' in mount_status.stdout or 'Transport endpoint is not connected' in mount_status.stderr"
      ignore_errors: true

    - name: Ensure mount point exists
      file:
        path: "{{ mount_dir }}"
        state: directory
        mode: '0755'

    - name: Attempt to mount GlusterFS volume (debug)
      shell: |
        set -x
        timeout 15 mount -v -t glusterfs {{ gluster_server }}:{{ volume_name }} {{ mount_dir }}
      register: mount_debug
      ignore_errors: true

    - name: Print mount debug output
      debug:
        msg: |
          STDOUT:
          {{ mount_debug.stdout }}

          STDERR:
          {{ mount_debug.stderr }}

    - name: Ensure mount succeeded
      fail:
        msg: >
          Mount failed with RC={{ mount_debug.rc }}.
          Check GlusterFS peer status, firewall, SELinux, and volume health.
      when: mount_debug.rc != 0
