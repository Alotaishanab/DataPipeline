- name: Install and Deploy React Frontend for UniRef50
  hosts: localhost
  become: yes

  vars:
    react_app_dir: /home/almalinux/DataPipeline/frontend/react-ui
    apache_web_root: /var/www/html
    nfs_results: /mnt/results
    nfs_datasets_chunks: /mnt/datasets/uni_chunks

  tasks:
    - name: Ensure Node.js and npm are installed
      yum:
        name:
          - nodejs
          - npm
        state: present

    - name: Install React dependencies
      shell: npm install
      args:
        chdir: "{{ react_app_dir }}"

    - name: Build the React app
      shell: npm run build
      args:
        chdir: "{{ react_app_dir }}"

    - name: Deploy React build to Apache web root
      copy:
        src: "{{ react_app_dir }}/build/"
        dest: "{{ apache_web_root }}/"
        remote_src: yes
        owner: apache
        group: apache
        mode: '0755'

    - name: Ensure all files in web root are readable by Apache
      file:
        path: "{{ apache_web_root }}"
        state: directory
        recurse: yes
        owner: apache
        group: apache
        mode: '0755'

    - name: Ensure chunked dataset directory exists
      file:
        path: "{{ nfs_datasets_chunks }}"
        state: directory
        mode: '0755'

    - name: Set SELinux context for Apache web root (if enabled)
      command: chcon -Rt httpd_sys_content_t {{ apache_web_root }}
      when: ansible_selinux.status == "enabled"

    - name: Set SELinux context for NFS mounts (if enabled)
      command: chcon -Rt httpd_sys_content_t {{ item }}
      loop:
        - "{{ nfs_results }}"
        - "{{ nfs_datasets_chunks }}"
      when: ansible_selinux.status == "enabled"

    - name: Ensure Apache can read NFS (if enabled)
      seboolean:
        name: httpd_use_nfs
        state: true
        persistent: yes
      when: ansible_selinux.status == "enabled"

    - name: Ensure mod_rewrite is enabled in Apache
      lineinfile:
        path: /etc/httpd/conf.modules.d/00-base.conf
        regexp: '^#?LoadModule rewrite_module'
        line: 'LoadModule rewrite_module modules/mod_rewrite.so'
        state: present

    - name: Create Apache config to serve React and NFS directories
      copy:
        dest: /etc/httpd/conf.d/react_ui.conf
        content: |
          <Directory "{{ apache_web_root }}">
              Options -Indexes +FollowSymLinks
              AllowOverride None
              Require all granted

              <IfModule mod_rewrite.c>
                RewriteEngine On
                RewriteCond %{REQUEST_FILENAME} !-f
                RewriteCond %{REQUEST_FILENAME} !-d
                RewriteRule ^ /index.html [L]
              </IfModule>
          </Directory>

          <Directory "{{ apache_web_root }}/results">
              Options Indexes FollowSymLinks
              AllowOverride None
              Require all granted
          </Directory>

          <Directory "{{ apache_web_root }}/datasets">
              Options Indexes FollowSymLinks
              AllowOverride None
              Require all granted
          </Directory>
        owner: root
        group: root
        mode: '0644'
      notify: restart_httpd

  handlers:
    - name: restart_httpd
      systemd:
        name: httpd
        state: restarted