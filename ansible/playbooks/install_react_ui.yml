- name: Install and Deploy React Frontend for UniRef50
  hosts: localhost
  become: yes

  vars:
    react_app_dir: /opt/data_pipeline/react-ui
    apache_web_root: /var/www/html

  tasks:
    - name: Ensure Node.js and npm are installed
      yum:
        name:
          - nodejs
          - npm
        state: present

    - name: Create React app if not already there
      command: npx create-react-app react-ui
      args:
        chdir: /opt/data_pipeline
      creates: "{{ react_app_dir }}/package.json"
      environment:
        PATH: "/usr/bin:/usr/local/bin:{{ ansible_env.PATH }}"  # ensure npx is found

    - name: Ensure react-router-dom is listed in package.json
      shell: npm install react-router-dom
      args:
        chdir: "{{ react_app_dir }}"
      when: not lookup('fileglob', '{{ react_app_dir }}/node_modules/react-router-dom', errors='ignore')

    - name: Build the React app
      shell: npm run build
      args:
        chdir: "{{ react_app_dir }}"

    - name: Deploy build directory to Apache root
      copy:
        src: "{{ react_app_dir }}/build/"
        dest: "{{ apache_web_root }}/"
        remote_src: yes
        owner: apache
        group: apache
        mode: '0755'
