- name: Mount Extra Disk on Worker Nodes
  hosts: worker_inventory
  become: yes
  tasks:
    - name: Ensure community.general collection is available
      ansible.builtin.meta: noop

    - name: Create XFS filesystem on /dev/vdb if not present
      community.general.filesystem:
        dev: /dev/vdb
        fstype: xfs
      register: fs_status

    - name: Filesystem creation result
      debug:
        msg: "Filesystem on /dev/vdb: {{ fs_status }}"

    - name: Create mount point for extra disk
      file:
        path: /mnt/data
        state: directory
        mode: '0755'

    - name: Mount /dev/vdb on /mnt/data if not already mounted
      mount:
        path: /mnt/data
        src: /dev/vdb
        fstype: xfs
        state: mounted
