- name: Partition, Format, and Mount Extra Disk on Worker Nodes
  hosts: worker_inventory
  become: yes
  vars:
    clean_minio_data: true  # Set to true to wipe the disk on fresh deployments
  tasks:
    - name: Unmount all partitions on /dev/vdb
      shell: "umount /dev/vdb* || true"
      ignore_errors: true

    - name: Wipe existing filesystem signatures from /dev/vdb
      command: wipefs -a /dev/vdb
      when: clean_minio_data | bool
      ignore_errors: true

    - name: Partition /dev/vdb if not already partitioned
      community.general.parted:
        device: /dev/vdb
        number: 1
        state: present
        part_type: primary
        fs_type: xfs
        align: optimal


    - name: Debug partition result
      debug:
        msg: "Partition result: {{ partition_result }}"

    - name: Create XFS filesystem on /dev/vdb1 if not present
      community.general.filesystem:
        dev: /dev/vdb1
        fstype: xfs
        force: yes
      register: fs_status

    - name: Debug filesystem creation result
      debug:
        msg: "Filesystem on /dev/vdb1: {{ fs_status }}"

    - name: Create mount point for extra disk
      file:
        path: /mnt/data
        state: directory
        mode: '0755'

    - name: Mount /dev/vdb1 on /mnt/data if not already mounted
      mount:
        path: /mnt/data
        src: /dev/vdb1
        fstype: xfs
        state: mounted
