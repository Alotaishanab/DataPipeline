- name: Partition, Format, and Mount Extra Disk on Worker Nodes
  hosts: worker_inventory
  become: yes
  vars:
    clean_minio_data: false

  tasks:
    - name: Check if /mnt/data is already mounted
      stat:
        path: /mnt/data
      register: data_mount_stat

    - name: Debug mount status
      debug:
        msg: "Mount /mnt/data ismount={{ data_mount_stat.stat.ismount }}; forcibly wiping={{ clean_minio_data }}"

    # If you do want to forcibly wipe, forcibly unmount
    - name: Kill processes & forcibly unmount if clean_minio_data
      block:
        - name: Kill processes using /mnt/data
          shell: fuser -km /mnt/data || true
          ignore_errors: true

        - name: Lazy unmount /mnt/data
          shell: "umount -l /mnt/data || true"
          ignore_errors: true
      when: data_mount_stat.stat.ismount and clean_minio_data

    - name: Wipe existing filesystem signatures if forcibly
      command: "wipefs -a /dev/vdb"
      when: clean_minio_data
      ignore_errors: true

    - name: Partition /dev/vdb
      community.general.parted:
        device: /dev/vdb
        number: 1
        state: present
        part_type: primary
        fs_type: xfs
        part_start: "0%"
        part_end: "100%"
      register: partition_result

    - name: Debug partition result
      debug:
        msg: "Partition result: {{ partition_result }}"

    # Only create filesystem if parted changed or forcibly reformat
    # Also skip if it's currently mounted and we do NOT forcibly wipe
    - name: Create XFS filesystem
      community.general.filesystem:
        dev: /dev/vdb1
        fstype: xfs
        force: yes
      when: >
        (partition_result.changed or clean_minio_data) and
        not (data_mount_stat.stat.ismount and not clean_minio_data)

    - name: Create mount point
      file:
        path: /mnt/data
        state: directory
        mode: '0755'

    - name: Mount /dev/vdb1 on /mnt/data
      ansible.builtin.mount:
        path: /mnt/data
        src: /dev/vdb1
        fstype: xfs
        state: mounted

    - name: Ensure /mnt/data is owned by almalinux
      file:
        path: /mnt/data
        state: directory
        owner: almalinux
        group: almalinux
        mode: '0755'
