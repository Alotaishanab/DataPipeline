- name: Partition, Format, and Mount Extra Disk on Worker Nodes
  hosts: worker_inventory
  become: yes
  vars:
    clean_minio_data: true  # True => forcibly wipe and reformat, false => skip reformat if it's already good

  tasks:
    #########################################################################
    # 1) Ensure /mnt/data is unmounted if we plan to wipe
    #########################################################################
    - name: Unmount /mnt/data if mounted
      ansible.builtin.mount:
        path: /mnt/data
        src: /dev/vdb1
        state: unmounted
      ignore_errors: true
      when: clean_minio_data | bool
        # Only forcibly unmount if we plan to wipe. If false, we keep existing mount.

    #########################################################################
    # 2) Optionally wipe existing filesystem signatures
    #########################################################################
    - name: Wipe existing filesystem signatures from /dev/vdb if forcibly desired
      command: "wipefs -a /dev/vdb"
      when: clean_minio_data | bool
      ignore_errors: true

    #########################################################################
    # 3) Partition /dev/vdb if not already partitioned
    #########################################################################
    - name: Partition /dev/vdb
      community.general.parted:
        device: /dev/vdb
        number: 1
        state: present
        part_type: primary
        fs_type: xfs
        part_start: "0%"
        part_end: "100%"
      register: partition_result

    - name: Debug partition result
      debug:
        msg: "Partition result: {{ partition_result }}"

    #########################################################################
    # 4) Create XFS filesystem on /dev/vdb1 if parted changed or forcibly reformat
    #########################################################################
    - name: Create XFS filesystem on /dev/vdb1
      community.general.filesystem:
        dev: /dev/vdb1
        fstype: xfs
        force: yes
      when: partition_result.changed or clean_minio_data | bool
        # If we forcibly wipe (clean_minio_data), or parted actually changed.

    #########################################################################
    # 5) Create mount point
    #########################################################################
    - name: Create mount point for extra disk
      file:
        path: /mnt/data
        state: directory
        mode: '0755'

    #########################################################################
    # 6) Mount /dev/vdb1 on /mnt/data
    #########################################################################
    - name: Mount /dev/vdb1 on /mnt/data
      ansible.builtin.mount:
        path: /mnt/data
        src: /dev/vdb1
        fstype: xfs
        state: mounted

    #########################################################################
    # 7) Fix ownership so almalinux can write to /mnt/data
    #########################################################################
    - name: Ensure /mnt/data is owned by almalinux
      file:
        path: /mnt/data
        state: directory
        owner: almalinux
        group: almalinux
        mode: '0755'
