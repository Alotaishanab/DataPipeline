- name: Partition, Format, and Mount Extra Disk on Worker Nodes
  hosts: worker_inventory
  become: yes
  vars:
    clean_minio_data: false

  tasks:
    - name: Check if /mnt/data is already a mount
      shell: "mountpoint -q /mnt/data"
      register: mountpoint_result
      changed_when: false
      failed_when: false

    - name: Debug mount status
      debug:
        msg: "Mount /mnt/data is_mounted={{ (mountpoint_result.rc == 0) }} ; forcibly wiping={{ clean_minio_data }}"

    - name: Kill processes & forcibly unmount if we are wiping
      block:
        - name: Kill processes using /mnt/data
          shell: fuser -km /mnt/data || true
          ignore_errors: true

        - name: Lazy unmount /mnt/data
          shell: "umount -l /mnt/data || true"
          ignore_errors: true
      when: mountpoint_result.rc == 0 and clean_minio_data

    - name: Wipe existing filesystem signatures from /dev/vdb if forcibly
      command: "wipefs -a /dev/vdb"
      when: clean_minio_data
      ignore_errors: true

    - name: Partition /dev/vdb
      community.general.parted:
        device: /dev/vdb
        number: 1
        state: present
        part_type: primary
        fs_type: xfs
        part_start: "0%"
        part_end: "100%"
      register: partition_result

    - name: Create XFS filesystem
      community.general.filesystem:
        dev: /dev/vdb1
        fstype: xfs
        force: yes
      when: (partition_result.changed or clean_minio_data) and not (mountpoint_result.rc == 0 and not clean_minio_data)

    - name: Create mount point
      file:
        path: /mnt/data
        state: directory
        mode: '0755'

    - name: Mount /dev/vdb1 on /mnt/data
      ansible.builtin.mount:
        path: /mnt/data
        src: /dev/vdb1
        fstype: xfs
        state: mounted

    - name: Ensure /mnt/data is owned by almalinux
      file:
        path: /mnt/data
        state: directory
        owner: almalinux
        group: almalinux
        mode: '0755'
