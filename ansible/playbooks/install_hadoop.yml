- name: Install and configure Hadoop
  hosts: all, localhost
  become: yes

  vars:
    mgmt_host: "mgmtnode"
    namenode_http_port: 9870
    yarn_rm_ui_port: 8088

  tasks:
    - name: Debug management node hostname
      debug:
        msg: "The management node is set to: {{ mgmt_host }}"

    - name: Download Hadoop
      ansible.builtin.get_url:
        dest: /home/almalinux/hadoop.tar.gz
        url: "https://dlcdn.apache.org/hadoop/common/hadoop-3.4.0/hadoop-3.4.0.tar.gz"

    - name: Unpack tgz file
      ansible.builtin.unarchive:
        dest: /home/almalinux/
        remote_src: true
        src: /home/almalinux/hadoop.tar.gz

    - name: ✅ Create NameNode and DataNode directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: almalinux
        group: almalinux
        mode: '0755'
        recurse: yes
      loop:
        - /opt/hadoop_tmp/hdfs/namenode
        - /opt/hadoop_tmp/hdfs/datanode

    - name: ✅ Set correct ownership on /opt/hadoop_tmp
      ansible.builtin.file:
        path: /opt/hadoop_tmp
        owner: almalinux
        group: almalinux
        recurse: yes

    - name: Set hadoop environment in .bashrc
      ansible.builtin.blockinfile:
        path: /home/almalinux/.bashrc
        block: |
          export JAVA_HOME=$(readlink -f /usr/bin/java | sed "s:bin/java::")
          export HADOOP_HOME=/home/almalinux/hadoop-3.4.0
          export HADOOP_INSTALL=$HADOOP_HOME
          export YARN_HOME=$HADOOP_HOME
          export PATH=$PATH:$HADOOP_INSTALL/bin:$HOME/spark-3.5.3-bin-hadoop3-scala2.13/bin
          export HADOOP_COMMON_LIB_NATIVE_DIR=$HADOOP_HOME/lib/native
          export HADOOP_OPTS="-Djava.library.path=$HADOOP_HOME/lib/native"
          export HADOOP_CONF_DIR=$HADOOP_HOME/etc/hadoop
          export LD_LIBRARY_PATH=$LD_LIBRARY_PATH:$HADOOP_HOME/lib/native
        state: present

    - name: Configure core-site.xml
      ansible.builtin.blockinfile:
        path: /home/almalinux/hadoop-3.4.0/etc/hadoop/core-site.xml
        insertafter: "<configuration>"
        marker: "<!-- {mark} ANSIBLE MANAGED BLOCK -->"
        block: |
          <property>
              <name>fs.defaultFS</name>
              <value>hdfs://{{ mgmt_host }}:9000</value>
          </property>
        state: present

    - name: Configure hdfs-site.xml
      ansible.builtin.blockinfile:
        path: /home/almalinux/hadoop-3.4.0/etc/hadoop/hdfs-site.xml
        insertafter: "<configuration>"
        marker: "<!-- {mark} ANSIBLE MANAGED BLOCK -->"
        block: |
          <property>
              <name>dfs.datanode.data.dir</name>
              <value>/opt/hadoop_tmp/hdfs/datanode</value>
              <final>true</final>
          </property>
          <property>
              <name>dfs.namenode.name.dir</name>
              <value>/opt/hadoop_tmp/hdfs/namenode</value>
              <final>true</final>
          </property>
          <property>
              <name>dfs.namenode.http-address</name>
              <value>0.0.0.0:{{ namenode_http_port }}</value>
          </property>
          <property>
              <name>dfs.replication</name>
              <value>2</value>
          </property>
        state: present

    - name: Configure yarn-site.xml
      ansible.builtin.blockinfile:
        path: /home/almalinux/hadoop-3.4.0/etc/hadoop/yarn-site.xml
        insertafter: "<configuration>"
        marker: "<!-- {mark} ANSIBLE MANAGED BLOCK -->"
        block: |
          <property>
              <name>yarn.resourcemanager.resource-tracker.address</name>
              <value>{{ mgmt_host }}:8025</value>
          </property>
          <property>
              <name>yarn.resourcemanager.scheduler.address</name>
              <value>{{ mgmt_host }}:8035</value>
          </property>
          <property>
              <name>yarn.resourcemanager.address</name>
              <value>{{ mgmt_host }}:8050</value>
          </property>
          <property>
              <name>yarn.resourcemanager.webapp.address</name>
              <value>0.0.0.0:{{ yarn_rm_ui_port }}</value>
          </property>
          <property>
              <name>yarn.log-aggregation-enable</name>
              <value>true</value>
          </property>
        state: present

    - name: Configure mapred-site.xml
      ansible.builtin.blockinfile:
        path: /home/almalinux/hadoop-3.4.0/etc/hadoop/mapred-site.xml
        insertafter: "<configuration>"
        marker: "<!-- {mark} ANSIBLE MANAGED BLOCK -->"
        block: |
          <property>
              <name>mapreduce.job.tracker</name>
              <value>{{ mgmt_host }}:5431</value>
          </property>
          <property>
              <name>mapred.framework.name</name>
              <value>yarn</value>
          </property>
        state: present

    - name: Fix JAVA_HOME in hadoop-env.sh
      ansible.builtin.blockinfile:
        path: /home/almalinux/hadoop-3.4.0/etc/hadoop/hadoop-env.sh 
        insertafter: "# export JAVA_HOME="
        block: |
          export JAVA_HOME=$(readlink -f /usr/bin/java | sed "s:bin/java::")
        state: present
