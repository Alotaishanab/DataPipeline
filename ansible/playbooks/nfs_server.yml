- name: Configure NFS Server on worker1
  hosts: worker1
  become: yes
  gather_facts: yes

  vars:
    export_datasets: "/mnt/datasets"
    export_results: "/mnt/results"

  tasks:
    - name: Install NFS utilities
      yum:
        name: nfs-utils
        state: present

    - name: Ensure 'nfsnobody' group exists
      group:
        name: nfsnobody
        state: present

    - name: Ensure 'nfsnobody' user exists
      user:
        name: nfsnobody
        group: nfsnobody
        shell: /sbin/nologin
        comment: 'Anon NFS User'
        state: present

    - name: Bind mount /data subdirs to NFS export points
      mount:
        src: "/data/{{ item }}"
        path: "/mnt/{{ item }}"
        fstype: none
        opts: bind
        state: mounted
      loop:
        - datasets
        - results

    - name: Disable reverse DNS lookups to prevent exportfs hanging
      lineinfile:
        path: /etc/nfs.conf
        regexp: '^#?reverse_lookup'
        line: 'reverse_lookup = no'
        create: yes

    - name: Add export rules with fsid and subnet
      copy:
        dest: /etc/exports
        content: |
          /mnt/datasets 10.0.0.0/24(rw,sync,no_root_squash,fsid=1,no_subtree_check,insecure)
          /mnt/results 10.0.0.0/24(rw,sync,no_root_squash,fsid=2,no_subtree_check,insecure)
        owner: root
        group: root
        mode: '0644'

    - name: Restart and enable NFS server
      systemd:
        name: nfs-server
        state: restarted
        enabled: yes

    - name: Export shares
      command: exportfs -rav
