- name: Configure NFS Server on Worker Nodes
  hosts: worker_inventory
  become: yes
  gather_facts: yes
  vars:
    # Path on each worker where the extra disk is mounted for datasets.
    dataset_mount_point: "/mnt/datasets"
  tasks:
    - name: Install NFS utilities
      yum:
        name: nfs-utils
        state: present

    - name: Partition, format, and mount extra disk (if not already done)
      debug:
        msg: "Extra disk should already be mounted at {{ dataset_mount_point }} on this worker."

    - name: Create mount point for datasets
      file:
        path: "{{ dataset_mount_point }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Set permissions on dataset directory for NFS
      file:
        path: "{{ dataset_mount_point }}"
        owner: nobody
        group: nobody
        mode: '0777'

    - name: Ensure 'nfsnobody' group exists
      group:
        name: nfsnobody
        state: present

    - name: Ensure 'nfsnobody' user exists
      user:
        name: nfsnobody
        group: nfsnobody
        shell: /sbin/nologin
        comment: 'Anon NFS User'
        state: present

    - name: Create mount point for results
      file:
        path: "/mnt/results"
        state: directory

    - name: Ensure proper permissions on datasets and results directories
      file:
        path: "{{ item }}"
        owner: nobody
        group: nobody
        mode: '0777'
      loop:
        - /mnt/datasets
        - /mnt/results

    - name: Configure NFS exports
      copy:
        content: |
          {{ dataset_mount_point }} *(rw,sync,no_root_squash)
          /mnt/results *(rw,sync,no_root_squash)
        dest: /etc/exports
        owner: root
        group: root
        mode: '0644'

    - name: Export NFS shares
      command: exportfs -rav

    - name: Start and enable NFS server
      systemd:
        name: nfs-server
        state: started
        enabled: yes

  handlers:
    - name: reload_firewalld
      systemd:
        name: firewalld
        state: reloaded
