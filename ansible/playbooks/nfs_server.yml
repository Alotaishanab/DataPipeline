- name: Configure NFS Server on Management Node
  hosts: localhost
  become: yes
  vars:
    nfs_datasets: /mnt/data/datasets
    nfs_results:   /mnt/data/results
  tasks:
    - name: Ensure nfs-utils and rpcbind are installed
      yum:
        name:
          - nfs-utils
          - rpcbind
        state: present

    - name: Ensure firewalld is installed
      yum:
        name: firewalld
        state: present
      notify: reload firewalld

    - name: Start and enable firewalld
      systemd:
        name: firewalld
        state: started
        enabled: yes

    - name: Allow NFS related services in firewall
      firewalld:
        service: "{{ item }}"
        state: enabled
        permanent: yes
      loop:
        - nfs
        - rpc-bind
        - mountd
      notify: reload firewalld

    - name: Start and enable rpcbind service
      systemd:
        name: rpcbind
        state: started
        enabled: yes

    - name: Start and enable NFS server
      systemd:
        name: nfs-server
        state: started
        enabled: yes

    - name: Create NFS share directory for datasets
      file:
        path: "{{ nfs_datasets }}"
        state: directory
        owner: nfsnobody
        group: nfsnobody
        mode: "0777"

    - name: Create NFS share directory for results
      file:
        path: "{{ nfs_results }}"
        state: directory
        owner: nfsnobody
        group: nfsnobody
        mode: "0777"

    - name: Configure NFS exports
      copy:
        content: |
          {{ nfs_datasets }} *(rw,sync,no_root_squash)
          {{ nfs_results }} *(rw,sync,no_root_squash)
        dest: /etc/exports
        owner: root
        group: root
        mode: "0644"

    - name: Export NFS shares
      command: exportfs -rav

  handlers:
    - name: reload firewalld
      systemd:
        name: firewalld
        state: reloaded
