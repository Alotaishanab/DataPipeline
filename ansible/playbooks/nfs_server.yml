- name: Configure NFS Server on Management Node
  hosts: localhost
  become: yes
  tasks:
    - name: Ensure nfs-utils and rpcbind are installed
      yum:
        name:
          - nfs-utils
          - rpcbind
        state: present

    - name: Ensure firewalld is installed
      yum:
        name: firewalld
        state: present
      notify: reload firewalld

    - name: Start and enable firewalld
      systemd:
        name: firewalld
        state: started
        enabled: yes

    - name: Allow NFS related services in firewall
      firewalld:
        service: "{{ item }}"
        state: enabled
        permanent: yes
      loop:
        - nfs
        - rpc-bind
        - mountd
      notify: reload firewalld

    - name: Start and enable rpcbind service
      systemd:
        name: rpcbind
        state: started
        enabled: yes

    - name: Start and enable NFS server
      systemd:
        name: nfs-server
        state: started
        enabled: yes

    - name: Partition /dev/vdb (if not already partitioned)
      community.general.parted:
        device: /dev/vdb
        number: 1
        state: present
        part_type: primary
        fs_type: xfs
        part_start: "0%"
        part_end: "100%"
        force: true

    - name: Create XFS filesystem on /dev/vdb1 (force if needed)
      community.general.filesystem:
        dev: /dev/vdb1
        fstype: xfs
        force: true

    - name: Create mount point for datasets
      file:
        path: /mnt/datasets
        state: directory

    - name: Mount the data partition on /mnt/datasets
      mount:
        path: /mnt/datasets
        src: /dev/vdb1
        fstype: xfs
        state: mounted

    - name: Create mount point for results
      file:
        path: /mnt/results
        state: directory

    - name: Set permissions on datasets and results directories
      file:
        path: "{{ item }}"
        owner: nfsnobody
        group: nfsnobody
        mode: '0777'
      loop:
        - /mnt/datasets
        - /mnt/results

    - name: Configure NFS exports
      copy:
        content: |
          /mnt/datasets *(rw,sync,no_root_squash)
          /mnt/results *(rw,sync,no_root_squash)
        dest: /etc/exports
        owner: root
        group: root
        mode: '0644'

    - name: Export NFS shares
      command: exportfs -rav

  handlers:
    - name: reload firewalld
      systemd:
        name: firewalld
        state: reloaded
