---
- name: Configure NFS Server on NFS Server Node
  hosts: worker1
  become: yes
  vars:
    nfs_datasets_dir: "/mnt/datasets"
    nfs_results_dir: "/mnt/results"
  tasks:
    - name: Install NFS utilities and rpcbind
      yum:
        name:
          - nfs-utils
          - rpcbind
        state: present

    - name: Ensure firewalld is installed
      yum:
        name: firewalld
        state: present

    - name: Start and enable firewalld
      systemd:
        name: firewalld
        state: started
        enabled: yes

    - name: Allow NFS related services in firewall
      firewalld:
        service: "{{ item }}"
        state: enabled
        permanent: yes
      loop:
        - nfs
        - rpc-bind
        - mountd
      notify: reload_firewalld

    - name: Start and enable rpcbind service
      systemd:
        name: rpcbind
        state: started
        enabled: yes

    - name: Start and enable NFS server
      systemd:
        name: nfs-server
        state: started
        enabled: yes

    - name: Create export directory for datasets
      file:
        path: "{{ nfs_datasets_dir }}"
        state: directory
        owner: nfsnobody
        group: nfsnobody
        mode: '0777'

    - name: Create export directory for results
      file:
        path: "{{ nfs_results_dir }}"
        state: directory
        owner: nfsnobody
        group: nfsnobody
        mode: '0777'

    - name: Configure NFS exports
      copy:
        content: |
          {{ nfs_datasets_dir }} *(rw,sync,no_root_squash)
          {{ nfs_results_dir }} *(rw,sync,no_root_squash)
        dest: /etc/exports
        owner: root
        group: root
        mode: '0644'

    - name: Export NFS shares
      command: exportfs -rav

  handlers:
    - name: reload_firewalld
      systemd:
        name: firewalld
        state: reloaded
