- name: Configure NFS Server on worker1
  hosts: worker1
  become: yes
  gather_facts: yes

  vars:
    export_datasets: "/mnt/datasets"
    export_results: "/mnt/results"

  tasks:
    - name: Install NFS utilities
      yum:
        name: nfs-utils
        state: present

    - name: Create export directories
      file:
        path: "{{ item }}"
        state: directory
        owner: nfsnobody
        group: nfsnobody
        mode: '0777'
      loop:
        - "{{ export_datasets }}"
        - "{{ export_results }}"

    - name: Add export rules
      copy:
        dest: /etc/exports
        content: |
          {{ export_datasets }} *(rw,sync,no_root_squash)
          {{ export_results }} *(rw,sync,no_root_squash)
        owner: root
        group: root
        mode: '0644'

    - name: Start and enable NFS
      systemd:
        name: nfs-server
        state: started
        enabled: yes

    - name: Export shares
      command: exportfs -rav
