---
- name: Setup ESM Pretrained Model Environment on Host
  hosts: localhost
  become: yes

  vars:
    esm_repo: "https://github.com/facebookresearch/esm.git"
    esm_dest: "/opt/esm"

    # CPU Torch Settings
    torch_version: "2.0.1+cpu"
    torch_url: "https://download.pytorch.org/whl/cpu/torch_stable.html"

    # We assume ESM might not have Torch pinned, but let's remove it if it does.
    # ESM model you want to download:
    esm_model: "esm1b_t33_650M_UR50S"

  tasks:
    - name: Ensure required system packages are installed for ESM
      dnf:
        name:
          - git
          - python3
          - python3-pip
        state: present
        update_cache: yes

    - name: Upgrade system pip to the latest version
      pip:
        name: pip
        executable: pip3
        state: latest

    - name: Uninstall existing torch if present (on system pip)
      pip:
        name: torch
        state: absent
        executable: pip3

    - name: Clone the ESM repository
      git:
        repo: "{{ esm_repo }}"
        dest: "{{ esm_dest }}"
        version: "main"

    - name: Remove any Torch lines in ESM's requirements.txt (if present)
      lineinfile:
        path: "{{ esm_dest }}/requirements.txt"
        regexp: '^torch==.*$'
        state: absent
      # Some forks might have ESM requirements pinned with Torch.
      # If that file doesn't exist, this task is just skipped.
      ignore_errors: yes

    - name: Create Python virtual environment for ESM
      command: /usr/bin/python3 -m venv "{{ esm_dest }}/venv"
      args:
        creates: "{{ esm_dest }}/venv"

    ##############################################################################
    # Optional: fix symlinks if your environment incorrectly sets python3 -> python
    ##############################################################################
    - name: Remove incorrect python3 symlink (if any)
      file:
        path: "{{ esm_dest }}/venv/bin/python3"
        state: absent

    - name: Create correct python3 symlink pointing to /usr/bin/python3
      file:
        src: /usr/bin/python3
        dest: "{{ esm_dest }}/venv/bin/python3"
        state: link

    - name: Ensure 'python' symlink points to 'python3'
      file:
        src: python3
        dest: "{{ esm_dest }}/venv/bin/python"
        state: link

    - name: Install ESM dependencies (except Torch) inside virtualenv
      pip:
        requirements: "{{ esm_dest }}/requirements.txt"
        virtualenv: "{{ esm_dest }}/venv"
        state: present
      # If no requirements.txt or no Torch lines, this is just ESM’s default libs.

    - name: Install CPU-only PyTorch in the ESM virtual environment
      pip:
        name: "torch=={{ torch_version }}"
        virtualenv: "{{ esm_dest }}/venv"
        state: present
        extra_args: "--find-links {{ torch_url }}"
      environment:
        TMPDIR: /var/tmp
        PIP_CACHE_DIR: /var/tmp/pip-cache

    - name: Download pretrained ESM model ({{ esm_model }})
      command: "{{ esm_dest }}/venv/bin/python -m esm.pretrained download {{ esm_model }}"
      args:
        chdir: "{{ esm_dest }}"
