- name: Setup ESM Pretrained Model Environment on Worker Nodes
  hosts: worker_inventory
  become: yes
  vars:
    esm_repo: "https://github.com/facebookresearch/esm.git"
    esm_dest: "/opt/esm"
    torch_version: "2.0.1+cpu"
    torch_url: "https://download.pytorch.org/whl/cpu/torch_stable.html"
    esm_model: "esm2_t30_150M_UR50D"

  tasks:
    - name: Create a directory on extra disk for pip temp/cache
      file:
        path: "/mnt/data/pip-tmp"
        state: directory
        mode: '0777'

    - name: Ensure required system packages are installed for ESM
      dnf:
        name:
          - git
          - python3
          - python3-pip
        state: present
        update_cache: yes

    - name: Upgrade system pip to the latest version
      pip:
        name: pip
        executable: pip3
        state: latest

    - name: Uninstall existing torch if present (on system pip)
      pip:
        name: torch
        state: absent
        executable: pip3

    - name: Clone the ESM repository
      git:
        repo: "{{ esm_repo }}"
        dest: "{{ esm_dest }}"
        version: "main"

    - name: Check if ESM requirements file exists
      stat:
        path: "{{ esm_dest }}/requirements.txt"
      register: esm_req_file

    - name: Remove any Torch lines from requirements.txt if present
      lineinfile:
        path: "{{ esm_dest }}/requirements.txt"
        regexp: '^torch==.*$'
        state: absent
      when: esm_req_file.stat.exists

    - name: Create Python virtual environment for ESM
      command: /usr/bin/python3 -m venv "{{ esm_dest }}/venv"
      args:
        creates: "{{ esm_dest }}/venv"

    - name: Remove incorrect python3 symlink (if any)
      file:
        path: "{{ esm_dest }}/venv/bin/python3"
        state: absent

    - name: Create correct python3 symlink pointing to /usr/bin/python3
      file:
        src: /usr/bin/python3
        dest: "{{ esm_dest }}/venv/bin/python3"
        state: link

    - name: Ensure 'python' symlink points to 'python3'
      file:
        src: python3
        dest: "{{ esm_dest }}/venv/bin/python"
        state: link

    - name: Install ESM dependencies (except Torch)
      pip:
        requirements: "{{ esm_dest }}/requirements.txt"
        virtualenv: "{{ esm_dest }}/venv"
        state: present
      when: esm_req_file.stat.exists

    - name: Install CPU-only PyTorch in the ESM virtual environment
      pip:
        name: "torch=={{ torch_version }}"
        virtualenv: "{{ esm_dest }}/venv"
        state: present
        extra_args: "--find-links {{ torch_url }}"
      environment:
        TMPDIR: "/mnt/data/pip-tmp"
        PIP_CACHE_DIR: "/mnt/data/pip-tmp"

    - name: Install ESM package in the virtual environment
      command: "{{ esm_dest }}/venv/bin/pip install -e {{ esm_dest }}"
      args:
        chdir: "{{ esm_dest }}"

    - name: Remove previously downloaded model (esm2_t33_650M_UR50D) if present
      file:
        path: "/root/.cache/torch/hub/checkpoints/esm2_t33_650M_UR50D.pt"
        state: absent

    - name: Download pretrained ESM model ({{ esm_model }})
      command: "{{ esm_dest }}/venv/bin/python -m esm.pretrained download {{ esm_model }}"
      args:
        chdir: "{{ esm_dest }}"
