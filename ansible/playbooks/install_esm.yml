- name: Setup ESM Pretrained Model Environment on Host
  hosts: localhost
  become: yes
  vars:
    esm_repo: "https://github.com/facebookresearch/esm.git"
    esm_dest: "/opt/esm"
    esm_model: "esm1b_t33_650M_UR50S"
  tasks:
    - name: Ensure required system packages are installed for ESM
      dnf:
        name:
          - git
          - python3
          - python3-pip
        state: present
        update_cache: yes

    - name: Clone the ESM repository
      git:
        repo: "{{ esm_repo }}"
        dest: "{{ esm_dest }}"
        version: "main"

    - name: Create Python virtual environment for ESM
      command: python3 -m venv {{ esm_dest }}/venv
      args:
        creates: "{{ esm_dest }}/venv/bin/activate"

    - name: Check if ESM requirements file exists
      stat:
        path: "{{ esm_dest }}/requirements.txt"
      register: esm_req_file

    - name: Install ESM Python dependencies (if requirements file exists)
      pip:
        requirements: "{{ esm_dest }}/requirements.txt"
        virtualenv: "{{ esm_dest }}/venv"
      when: esm_req_file.stat.exists

    - name: (Alternative) Install ESM repository as an editable package if no requirements file exists
      pip:
        chdir: "{{ esm_dest }}"
        virtualenv: "{{ esm_dest }}/venv"
        editable: yes
        name: .
      when: not esm_req_file.stat.exists

    - name: Install PyTorch in the ESM virtual environment
      pip:
        name: torch
        virtualenv: "{{ esm_dest }}/venv"

    - name: Download pretrained ESM model (esm1b_t33_650M_UR50S)
      command: "{{ esm_dest }}/venv/bin/python -m esm.pretrained download {{ esm_model }}"
      args:
        chdir: "{{ esm_dest }}"
