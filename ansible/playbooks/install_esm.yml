- name: Setup ESM Pretrained Model Environment on Worker Nodes
  hosts: worker_inventory
  become: yes
  vars:
    esm_repo: "https://github.com/facebookresearch/esm.git"
    esm_dest: "/opt/esm"
    venv_path: "/opt/esm/venv"
    torch_version: "2.0.1+cpu"
    torch_url: "https://download.pytorch.org/whl/cpu/torch_stable.html"
    esm_model: "esm2_t6_8M_UR50D"
    pip_tmp_dir: "/mnt/data/pip-tmp"

  tasks:
    - name: Create pip temp/cache directory
      file:
        path: "{{ pip_tmp_dir }}"
        state: directory
        mode: '0777'

    - name: Ensure system packages are installed
      dnf:
        name:
          - git
          - python3
          - python3-pip
        state: present
        update_cache: yes

    - name: Upgrade system pip
      pip:
        name: pip
        executable: pip3
        state: latest

    - name: Uninstall system-wide torch if present
      pip:
        name: torch
        state: absent
        executable: pip3

    - name: Clone ESM repository
      git:
        repo: "{{ esm_repo }}"
        dest: "{{ esm_dest }}"
        version: "main"

    - name: Create Python virtual environment for ESM
      command: python3 -m venv "{{ venv_path }}"
      args:
        creates: "{{ venv_path }}"

    - name: Fix symlinks for python/python3 in venv
      block:
        - name: Remove incorrect python3 symlink
          file:
            path: "{{ venv_path }}/bin/python3"
            state: absent

        - name: Create correct python3 symlink
          file:
            src: /usr/bin/python3
            dest: "{{ venv_path }}/bin/python3"
            state: link

        - name: Ensure 'python' symlink points to python3
          file:
            src: python3
            dest: "{{ venv_path }}/bin/python"
            state: link

    - name: Install required Python libraries for ESM (excluding torch)
      pip:
        virtualenv: "{{ venv_path }}"
        name:
          - fair-esm
          - biopython
        state: present
      environment:
        TMPDIR: "{{ pip_tmp_dir }}"
        PIP_CACHE_DIR: "{{ pip_tmp_dir }}"

    - name: Install CPU-only PyTorch
      pip:
        name: "torch=={{ torch_version }}"
        virtualenv: "{{ venv_path }}"
        extra_args: "--find-links {{ torch_url }}"
      environment:
        TMPDIR: "{{ pip_tmp_dir }}"
        PIP_CACHE_DIR: "{{ pip_tmp_dir }}"

    - name: Install ESM package in editable mode
      command: "{{ venv_path }}/bin/pip install -e {{ esm_dest }}"
      args:
        chdir: "{{ esm_dest }}"

    - name: Pin numpy < 2.0
      pip:
        name: "numpy<2"
        virtualenv: "{{ venv_path }}"
        state: present
      environment:
        TMPDIR: "{{ pip_tmp_dir }}"
        PIP_CACHE_DIR: "{{ pip_tmp_dir }}"

    - name: Download pretrained ESM model
      command: "{{ venv_path }}/bin/python -m esm.pretrained download {{ esm_model }}"
      args:
        chdir: "{{ esm_dest }}"
