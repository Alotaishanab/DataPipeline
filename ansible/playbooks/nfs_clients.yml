---
- name: Configure NFS Clients on Management and Worker Nodes
  hosts: localhost, worker_inventory
  become: yes
  vars:
    # Here we assume the NFS server is worker1.
    nfs_server_ip: "{{ hostvars['worker1'].ansible_host }}"
    nfs_shares:
      - { mount_point: '/mnt/datasets', remote_path: '/mnt/datasets' }
      - { mount_point: '/mnt/results', remote_path: '/mnt/results' }
  tasks:
    - name: Install NFS client utilities
      yum:
        name: nfs-utils
        state: present

    - name: Ensure mount points exist for NFS shares
      file:
        path: "{{ item.mount_point }}"
        state: directory
        mode: '0755'
      loop: "{{ nfs_shares }}"

    - name: Mount NFS shares
      mount:
        path: "{{ item.mount_point }}"
        src: "{{ nfs_server_ip }}:{{ item.remote_path }}"
        fstype: nfs
        opts: "rw,sync"
        state: mounted
      loop: "{{ nfs_shares }}"
