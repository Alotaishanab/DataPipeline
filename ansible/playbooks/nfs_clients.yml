- name: Configure NFS Clients on Host and Worker VMs
  hosts: host, workers
  become: yes
  vars:
    storage_ip: "{{ hostvars['localhost']['ansible_default_ipv4']['address'] }}"  # Change as needed if storage is separate
    nfs_mounts:
      - { mount_point: '/mnt/datasets', remote_path: '/mnt/data/datasets' }
      - { mount_point: '/mnt/results', remote_path: '/mnt/data/results' }
  tasks:
    - name: Install NFS utilities
      yum:
        name: nfs-utils
        state: present

    - name: Ensure NFS mounts are unmounted (stale mounts)
      ansible.posix.mount:
        path: "{{ item.mount_point }}"
        state: unmounted
        fstype: nfs
      loop: "{{ nfs_mounts }}"
      ignore_errors: yes

    - name: Create mount points for NFS shares
      file:
        path: "{{ item.mount_point }}"
        state: directory
        owner: almalinux
        group: almalinux
        mode: '0755'
      loop: "{{ nfs_mounts }}"

    - name: Mount NFS shares
      ansible.posix.mount:
        src: "{{ storage_ip }}:{{ item.remote_path }}"
        path: "{{ item.mount_point }}"
        fstype: nfs
        opts: "vers=4,rw,noatime,rsize=65536,wsize=65536"
        state: mounted
      loop: "{{ nfs_mounts }}"
