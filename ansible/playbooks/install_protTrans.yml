- name: Setup ProtTrans (ProtAlbert‑BFD) Environment on Worker Nodes
  hosts: worker_inventory
  become: yes
  vars:
    prottrans_repo: "https://github.com/agemagician/ProtTrans.git"
    prottrans_dest: "/opt/prottrans"
    torch_version: "2.0.1+cpu"
    torch_url: "https://download.pytorch.org/whl/cpu/torch_stable.html"
    prottrans_model: "prot_albert_bfd"

  tasks:
    - name: Create a directory on extra disk for pip temp/cache
      file:
        path: "/mnt/data/pip-tmp"
        state: directory
        mode: '0777'

    - name: Ensure required system packages are installed
      dnf:
        name:
          - git
          - python3
          - python3-pip
        state: present
        update_cache: yes

    - name: Upgrade system pip to the latest version
      pip:
        name: pip
        executable: pip3
        state: latest

    - name: Uninstall existing torch if present (system pip)
      pip:
        name: torch
        state: absent
        executable: pip3

    - name: Clone the ProtTrans repository
      git:
        repo: "{{ prottrans_repo }}"
        dest: "{{ prottrans_dest }}"
        version: "main"

    - name: Create Python virtual environment for ProtTrans
      command: /usr/bin/python3 -m venv "{{ prottrans_dest }}/venv"
      args:
        creates: "{{ prottrans_dest }}/venv"

    - name: Symlink python3 into venv
      file:
        src: /usr/bin/python3
        dest: "{{ prottrans_dest }}/venv/bin/python3"
        state: link

    - name: Ensure 'python' points at 'python3'
      file:
        src: python3
        dest: "{{ prottrans_dest }}/venv/bin/python"
        state: link

    - name: Install ProtTrans dependencies
      pip:
        requirements: "{{ prottrans_dest }}/requirements.txt"
        virtualenv: "{{ prottrans_dest }}/venv"
        state: present

    - name: Install biopython for FASTA parsing
      pip:
        name: biopython
        virtualenv: "{{ prottrans_dest }}/venv"
        state: present
      environment:
        TMPDIR: "/mnt/data/pip-tmp"
        PIP_CACHE_DIR: "/mnt/data/pip-tmp"

    - name: Install CPU‑only PyTorch in the ProtTrans venv
      pip:
        name: "torch=={{ torch_version }}"
        virtualenv: "{{ prottrans_dest }}/venv"
        extra_args: "--find-links {{ torch_url }}"
        state: present
      environment:
        TMPDIR: "/mnt/data/pip-tmp"
        PIP_CACHE_DIR: "/mnt/data/pip-tmp"

    - name: Install ProtTrans package in the virtual environment
      command: "{{ prottrans_dest }}/venv/bin/pip install -e {{ prottrans_dest }}"
      args:
        chdir: "{{ prottrans_dest }}"

    - name: Download pretrained ProtAlbert‑BFD model ({{ prottrans_model }})
      command: >
        {{ prottrans_dest }}/venv/bin/python
        -m prottrans.pretrained download {{ prottrans_model }}
      args:
        chdir: "{{ prottrans_dest }}"
