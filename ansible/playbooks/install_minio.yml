- name: Set up and install MinIO (combined)
  become: true
  become_user: root
  hosts: all, localhost

  tasks:
    ################################################################
    # 1. Basic MinIO user & group setup
    ################################################################
    - name: Create minio group
      ansible.builtin.group:
        name: minio-user
        state: present

    - name: Create minio user
      ansible.builtin.user:
        name: minio-user
        groups: minio-user
        password_lock: true
        state: present

    ################################################################
    # 2. TLS certificate generation (optional if you want HTTPS/TLS)
    ################################################################
    - name: Copy TLS generation stub
      ansible.builtin.copy:
        mode: "0700"
        src: "./files/generate_certs.sh"
        dest: "/root/generate_certs.sh"
      when: generate_certs_sh is defined and generate_certs_sh | bool

    - name: Generate TLS certificate for MinIO
      ansible.builtin.shell: "bash /root/generate_certs.sh {{ inventory_hostname }}"
      when: generate_certs_sh is defined and generate_certs_sh | bool

    - name: Create MinIO settings directory
      ansible.builtin.file:
        path: "/home/minio-user/.minio"
        state: directory
        owner: minio-user
        group: minio-user
      when: generate_certs_sh is defined and generate_certs_sh | bool

    - name: Create MinIO certs directory
      ansible.builtin.file:
        path: "/home/minio-user/.minio/certs"
        state: directory
        owner: minio-user
        group: minio-user
      when: generate_certs_sh is defined and generate_certs_sh | bool

    - name: Copy public cert to MinIO
      ansible.builtin.copy:
        remote_src: true
        owner: minio-user
        group: minio-user
        mode: "0600"
        src: "/root/minio.crt"
        dest: "/home/minio-user/.minio/certs/public.crt"
      when: generate_certs_sh is defined and generate_certs_sh | bool

    - name: Copy private key to MinIO
      ansible.builtin.copy:
        remote_src: true
        owner: minio-user
        group: minio-user
        mode: "0600"
        src: "/root/minio.key"
        dest: "/home/minio-user/.minio/certs/private.key"
      when: generate_certs_sh is defined and generate_certs_sh | bool

    ################################################################
    # 3. Data directory for MinIO
    ################################################################
    - name: Create /data/minio data directory
      ansible.builtin.file:
        path: "/data/minio"
        owner: minio-user
        group: minio-user
        mode: "0700"
        state: directory

    ################################################################
    # 4. Download & install MinIO server
    ################################################################
    - name: Delete old RPM
      ansible.builtin.file:
        path: "/root/minio.rpm"
        state: absent

    - name: Get Minio RPM
      ansible.builtin.get_url:
        dest: "/root/minio.rpm"
        url: "https://dl.min.io/server/minio/release/linux-amd64/minio.rpm"

    - name: Install Minio RPM
      ansible.builtin.shell: "dnf install -y /root/minio.rpm"

    ################################################################
    # 5. MinIO client (mc)
    ################################################################
    - name: Install MinIO command-line
      ansible.builtin.get_url:
        dest: "/usr/local/bin/mc"
        url: "https://dl.min.io/client/mc/release/linux-amd64/mc"
        mode: "0755"

    ################################################################
    # 6. Environment configuration & systemd service
    ################################################################
    - name: Configure MinIO environment
      ansible.builtin.template:
        src: "files/minio.j2"             # Your environment template
        dest: "/etc/default/minio"
        owner: root
        group: minio-user
        mode: "0640"

    - name: Enable and start MinIO service
      ansible.builtin.systemd_service:
        name: minio
        state: started
        enabled: true

    ################################################################
    # 7. Optional: MinIO client setup for 'almalinux' user
    ################################################################
    - name: Create MinIO client settings directory
      ansible.builtin.file:
        path: "/home/almalinux/.mc"
        state: directory
        owner: almalinux
        group: almalinux

    - name: Create MinIO client certs directory
      ansible.builtin.file:
        path: "/home/almalinux/.mc/certs"
        state: directory
        owner: almalinux
        group: almalinux
      when: generate_certs_sh is defined and generate_certs_sh | bool

    - name: Create MinIO client CA directory
      ansible.builtin.file:
        path: "/home/almalinux/.mc/certs/CAs"
        state: directory
        owner: almalinux
        group: almalinux
      when: generate_certs_sh is defined and generate_certs_sh | bool

    - name: Copy cert to almalinux's mc cert directory
      ansible.builtin.copy:
        remote_src: true
        owner: almalinux
        group: almalinux
        mode: "0600"
        src: "/root/minio.crt"
        dest: "/home/almalinux/.mc/certs/{{ inventory_hostname }}.crt"
      when: generate_certs_sh is defined and generate_certs_sh | bool

    - name: Copy cert to almalinux's mc CA directory
      ansible.builtin.copy:
        remote_src: true
        owner: almalinux
        group: almalinux
        mode: "0600"
        src: "/root/minio.crt"
        dest: "/home/almalinux/.mc/certs/CAs/local.crt"
      when: generate_certs_sh is defined and generate_certs_sh | bool

    - name: Copy minio pass to almalinux directory
      ansible.builtin.copy:
        owner: almalinux
        group: almalinux
        mode: "0600"
        src: "./.miniopass"
        dest: "/home/almalinux/miniopass"
      when: miniopass_file is defined and miniopass_file | bool

    - name: Setup mc for local access
      ansible.builtin.template:
        src: "files/mc_config.json.j2"
        dest: "/home/almalinux/.mc/config.json"
        owner: almalinux
        group: almalinux
        mode: "0600"
      when: miniopass_file is defined and miniopass_file | bool
