- name: Install Celery Worker on Worker Nodes
  hosts: worker_inventory
  become: yes
  vars:
    venv_path: "/opt/esm/venv"
    celery_app_path: "/home/almalinux/celery_app"
    redis_host: "mgmtnode"
    redis_port: 6379
    esm_user: "almalinux"

  tasks:
    - name: Create Celery app directory if not exists
      file:
        path: "{{ celery_app_path }}"
        state: directory
        owner: "{{ esm_user }}"
        group: "{{ esm_user }}"
        mode: '0755'

    - name: Install Celery and Redis in virtualenv
      pip:
        virtualenv: "{{ venv_path }}"
        name:
          - celery
          - redis
        state: latest

    - name: Upload Celery worker script
      copy:
        src: "../scripts/celery_worker.py"
        dest: "{{ celery_app_path }}/worker.py"
        owner: "{{ esm_user }}"
        group: "{{ esm_user }}"
        mode: '0755'

    - name: Create systemd unit file for Celery worker
      copy:
        dest: "/etc/systemd/system/celery-worker.service"
        content: |
          [Unit]
          Description=Celery Worker Service
          After=network.target

          [Service]
          Type=simple
          User={{ esm_user }}
          Group={{ esm_user }}
          WorkingDirectory={{ celery_app_path }}
          Environment="PYTHONUNBUFFERED=1"
          ExecStart={{ venv_path }}/bin/celery -A worker worker --loglevel=info --concurrency=1 -Q esm
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Enable and start Celery Worker

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Enable and start Celery Worker
      systemd:
        name: celery-worker.service
        enabled: yes
        state: restarted


- name: Install and Configure Flower
  hosts: localhost
  become: yes
  vars:
    flower_user: "almalinux"
    flower_group: "almalinux"
    flower_port: 5555
    flower_log_dir: "/var/log/flower"
    flower_pid_file: "/var/run/flower/flower.pid"
    flower_broker_url: "redis://localhost:6379/0"  # Adjust to your broker URL
    flower_basic_auth: "flower:flower"  # Set to desired basic auth credentials

  tasks:
    - name: Install Flower using pip
      pip:
        name: flower
        state: present
        executable: pip3

    - name: Create Flower log directory
      file:
        path: "{{ flower_log_dir }}"
        state: directory
        owner: "{{ flower_user }}"
        group: "{{ flower_group }}"
        mode: '0755'

    - name: Create directory for Flower PID file
      file:
        path: "{{ flower_pid_file | dirname }}"
        state: directory
        owner: "{{ flower_user }}"
        group: "{{ flower_group }}"
        mode: '0755'

    - name: Create systemd service file for Flower
      copy:
        dest: /etc/systemd/system/flower.service
        content: |
          [Unit]
          Description=Flower Celery Monitoring Tool
          After=network.target

          [Service]
          Type=simple
          User={{ flower_user }}
          Group={{ flower_group }}
          WorkingDirectory=/home/{{ flower_user }}
          ExecStart=/usr/local/bin/flower --port={{ flower_port }} --broker={{ flower_broker_url }} --basic_auth={{ flower_basic_auth }} --log-file-prefix={{ flower_log_dir }}/flower.log --pidfile={{ flower_pid_file }}
          Restart=always

          [Install]
          WantedBy=multi-user.target
      notify: Reload systemd

    - name: Start and enable Flower service
      systemd:
        name: flower
        state: started
        enabled: yes
        daemon_reload: yes

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes

