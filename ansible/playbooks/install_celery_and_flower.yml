- name: Install Celery Worker on Worker Nodes
  hosts: worker_inventory
  become: yes
  vars:
    venv_path: "/opt/esm/venv"
    celery_app_path: "/home/almalinux/celery_app"
    redis_host: "mgmtnode"
    redis_port: 6379
    esm_user: "almalinux"

  tasks:
    - name: Create Celery app directory if not exists
      file:
        path: "{{ celery_app_path }}"
        state: directory
        owner: "{{ esm_user }}"
        group: "{{ esm_user }}"
        mode: '0755'

    - name: Install Celery and Redis in virtualenv
      pip:
        virtualenv: "{{ venv_path }}"
        name:
          - celery
          - redis
        state: latest

    - name: Upload Celery worker script
      copy:
        src: "../scripts/celery_worker.py"
        dest: "{{ celery_app_path }}/worker.py"
        owner: "{{ esm_user }}"
        group: "{{ esm_user }}"
        mode: '0755'

    - name: Create systemd unit file for Celery worker
      copy:
        dest: "/etc/systemd/system/celery-worker.service"
        content: |
          [Unit]
          Description=Celery Worker Service
          After=network.target

          [Service]
          Type=simple
          User={{ esm_user }}
          Group={{ esm_user }}
          WorkingDirectory={{ celery_app_path }}
          Environment="PYTHONUNBUFFERED=1"
          ExecStart={{ venv_path }}/bin/celery -A worker worker --loglevel=info --concurrency=1 -Q esm
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Enable and start Celery Worker

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Enable and start Celery Worker
      systemd:
        name: celery-worker.service
        enabled: yes
        state: restarted


- name: Install and Configure Flower
  hosts: localhost
  become: yes
  vars:
    redis_host: "mgmtnode"
    redis_port: 6379
    flower_port: 5555
    celery_app_path: "/home/almalinux/celery_app"
    esm_user: "almalinux"

  tasks:
    - name: Ensure pip is available
      package:
        name: python3-pip
        state: present

    - name: Install flower globally and force path to /usr/local/bin
      command: >
        pip3 install --break-system-packages --force-reinstall flower
      args:
        creates: /usr/local/bin/flower

    - name: Find flower binary location
      command: which flower
      register: flower_bin
      changed_when: false

    - name: Debug flower path
      debug:
        msg: "Flower binary is at {{ flower_bin.stdout }}"

    - name: Create systemd unit for Flower
      copy:
        dest: /etc/systemd/system/celery-flower.service
        content: |
          [Unit]
          Description=Celery Flower Service
          After=network.target

          [Service]
          Type=simple
          User={{ esm_user }}
          Group={{ esm_user }}
          WorkingDirectory={{ celery_app_path }}
          ExecStart={{ flower_bin.stdout }} --broker=redis://{{ redis_host }}:{{ redis_port }}/0 --port={{ flower_port }}
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Enable and start Flower UI

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Enable and start Flower UI
      systemd:
        name: celery-flower.service
        enabled: yes
        state: restarted
