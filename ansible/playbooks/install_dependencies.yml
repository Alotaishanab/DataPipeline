- name: Ensure essential Packages on Control Node
  hosts: localhost
  gather_facts: yes
  become: yes
  tasks:
    - name: Install and Configure Alertmanager on Host
      import_role:
        name: alert_manager

    - name: Install essential system packages for ESM on Host (AlmaLinux)
      dnf:
        name:
          - git
          - python3
          - python3-pip
        state: present
        update_cache: yes
