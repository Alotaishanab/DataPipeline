- name: Ensure Ansible Galaxy Dependencies and Essential Packages on Control Node
  hosts: localhost
  gather_facts: yes
  become: yes

  tasks:
    - name: Check if community.general collection is installed
      stat:
        path: "{{ lookup('env','HOME') }}/.ansible/collections/ansible_collections/community/general"
      register: community_collection

    - name: Install community.general collection if not present
      command: ansible-galaxy collection install community.general
      when: not community_collection.stat.exists
      register: collection_install

    - name: Install and Configure Alertmanager on Host
      import_role:
        name: alert_manager

    - name: Install essential system packages for ESM on Host (AlmaLinux)
      dnf:
        name:
          - git
          - python3
          - python3-pip
          - pigz
        state: present
        update_cache: yes

    - name: Install httpd
      yum:
        name: httpd
        state: present

    - name: Ensure httpd service is started and enabled
      systemd:
        name: httpd
        state: started
        enabled: yes

- name: Install Flower (Celery monitoring UI) on Management Node
  hosts: localhost
  become: yes
  vars:
    venv_path: "/opt/esm/venv"  # Virtualenv path
    celery_broker_url: "redis://mgmtnode:6379/0"  # Celery broker URL
    flower_port: 5555  # Define the port for Flower UI

  tasks:
    - name: Ensure pip is installed in the virtual environment
      pip:
        virtualenv: "{{ venv_path }}"
        name: pip
        state: latest

    - name: Install Flower using pip
      pip:
        virtualenv: "{{ venv_path }}"
        name: flower
        state: latest

    - name: Create systemd unit file for Flower service
      copy:
        dest: "/etc/systemd/system/flower.service"
        content: |
          [Unit]
          Description=Flower - Celery Monitoring UI
          After=network.target

          [Service]
          User=almalinux
          Group=almalinux
          WorkingDirectory={{ venv_path }}
          Environment="PATH={{ venv_path }}/bin:$PATH"
          ExecStart={{ venv_path }}/bin/celery -A worker flower --port={{ flower_port }} --broker={{ celery_broker_url }}
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd to register Flower service
      systemd:
        daemon_reload: yes

    - name: Enable and start Flower service
      systemd:
        name: flower.service
        enabled: yes
        state: started









