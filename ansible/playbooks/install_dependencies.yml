---
- name: Install Ansible Galaxy Dependencies on Control Node
  hosts: localhost
  gather_facts: no
  become: yes
  tasks:
    - name: Install community.general collection
      command: ansible-galaxy collection install community.general
      register: community_result

    - name: Show community.general install output
      debug:
        msg: "{{ community_result.stdout }}"

    - name: Install ricsanfre.minio role
      command: ansible-galaxy role install ricsanfre.minio
      register: minio_role_result

    - name: Show ricsanfre.minio role install output
      debug:
        msg: "{{ minio_role_result.stdout }}"

- name: Install and Configure Alertmanager on Host
  hosts: localhost
  become: yes
  roles:
    - alert_manager

- name: Install System Packages and Python Tools for ESM on Host
  hosts: localhost
  become: yes
  tasks:
    - name: Ensure required system packages are installed
      apt:
        name:
          - git
          - python3
          - python3-venv
          - python3-pip
        state: present
        update_cache: yes
