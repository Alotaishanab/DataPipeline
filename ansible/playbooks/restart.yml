---
- name: Flush Celery tasks from Redis on Management Node
  hosts: localhost
  become: yes
  tasks:
    - name: Flush Redis DB 0 (remove all pending Celery tasks)
      command: redis-cli -n 0 FLUSHDB
      register: flush_result
    - name: Display flush output
      debug:
        var: flush_result.stdout

- name: Restart Celery Workers on Worker Nodes
  hosts: worker_inventory
  become: yes
  tasks:
    - name: Restart celery-worker service via systemd
      systemd:
        name: celery-worker.service
        state: restarted
        enabled: yes

- name: Restart Controller on Management Node
  hosts: localhost
  become: yes
  tasks:
    - name: Kill any running controller.py processes
      shell: pkill -f controller.py || true
      ignore_errors: yes
    - name: Start new controller.py in background with proper PYTHONPATH
      shell: |
        source /opt/esm/venv/bin/activate
        export PYTHONPATH=/home/almalinux
        nohup python /home/almalinux/esm_pipeline/controller.py > /mnt/data_volume/results/controller_submit_log.txt 2>&1 &
      args:
        chdir: /home/almalinux/esm_pipeline

- name: (Optional) Verify Celery Workers Status from Management Node
  hosts: localhost
  become: yes
  tasks:
    - name: Check active tasks on all workers using the celery_worker app module
      shell: |
        source /opt/esm/venv/bin/activate
        celery -A celery_app.celery_worker inspect active
      register: celery_status
    - name: Print Celery workers active tasks
      debug:
        var: celery_status.stdout_lines
