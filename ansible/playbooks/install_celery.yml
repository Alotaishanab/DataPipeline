- name: Install Celery Worker on Worker Nodes
  hosts: worker_inventory
  become: yes
  vars:
    venv_path: "/opt/esm/venv"
    celery_app_path: "/home/almalinux/celery_app"
    esm_user: "almalinux"

  tasks:
    - name: Create Celery app directory
      file:
        path: "{{ celery_app_path }}"
        state: directory
        owner: "{{ esm_user }}"
        group: "{{ esm_user }}"
        mode: '0755'

    - name: Install Celery and Redis
      pip:
        virtualenv: "{{ venv_path }}"
        name:
          - celery
          - redis
        state: latest

    - name: Upload worker.py (Celery task)
      copy:
        src: "../scripts/worker.py"
        dest: "{{ celery_app_path }}/worker.py"
        owner: "{{ esm_user }}"
        group: "{{ esm_user }}"
        mode: '0755'

    - name: Create systemd unit file for Celery Worker
      copy:
        dest: "/etc/systemd/system/celery-worker.service"
        content: |
          [Unit]
          Description=Celery Worker Service
          After=network.target

          [Service]
          Type=simple
          User={{ esm_user }}
          Group={{ esm_user }}
          WorkingDirectory={{ celery_app_path }}
          Environment="PYTHONUNBUFFERED=1"
          ExecStart={{ venv_path }}/bin/celery -A worker worker --loglevel=info --concurrency=4
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Restart Celery Worker

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Restart Celery Worker
      systemd:
        name: celery-worker.service
        state: restarted
        enabled: yes


- name: Install Celery and Redis modules on Management Node (localhost)
  hosts: localhost
  become: yes
  vars:
    venv_path: "/opt/esm/venv"

  tasks:
    - name: Ensure venv directory exists
      file:
        path: "{{ venv_path }}"
        state: directory
        mode: '0755'

    - name: Create virtual environment if not present
      command: python3 -m venv "{{ venv_path }}"
      args:
        creates: "{{ venv_path }}/bin/activate"

    - name: Install Celery and Redis in virtualenv on mgmtnode
      pip:
        virtualenv: "{{ venv_path }}"
        name:
          - celery
          - redis
        state: latest

- name: Install Flower (Celery monitoring UI) on Management Node
  hosts: localhost
  become: yes
  vars:
    venv_path: "/opt/esm/venv"  # Virtualenv path
    celery_broker_url: "redis://mgmtnode:6379/0"  # Celery broker URL

  tasks:
    - name: Ensure pip is installed in the virtual environment
      pip:
        virtualenv: "{{ venv_path }}"
        name: pip
        state: latest

    - name: Install Flower using pip
      pip:
        virtualenv: "{{ venv_path }}"
        name: flower
        state: latest

    - name: Create systemd unit file for Flower service
      copy:
        dest: "/etc/systemd/system/flower.service"
        content: |
          [Unit]
          Description=Flower - Celery Monitoring UI
          After=network.target

          [Service]
          User=almalinux
          Group=almalinux
          WorkingDirectory={{ venv_path }}
          Environment="PATH={{ venv_path }}/bin:$PATH"
          ExecStart={{ venv_path }}/bin/celery -A worker flower --port={{ flower_port }} --broker={{ celery_broker_url }}
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd to register Flower service
      systemd:
        daemon_reload: yes

    - name: Enable and start Flower service
      systemd:
        name: flower.service
        enabled: yes
        state: started


