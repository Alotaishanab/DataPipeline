- name: Install Redis on Management Node
  hosts: localhost
  become: yes
  tasks:
    - name: Install Redis
      ansible.builtin.yum:
        name: redis
        state: present

    - name: Enable and start Redis service
      ansible.builtin.systemd:
        name: redis
        enabled: yes
        state: started

    - name: Open Redis port in firewall
      ansible.builtin.firewalld:
        port: 6379/tcp
        permanent: true
        state: enabled
        immediate: yes

    - name: Allow Redis to listen on all interfaces
      ansible.builtin.lineinfile:
        path: /etc/redis/redis.conf
        regexp: '^bind '
        line: 'bind 0.0.0.0'
        backup: yes

    - name: Disable protected mode in Redis
      ansible.builtin.lineinfile:
        path: /etc/redis/redis.conf
        regexp: '^protected-mode '
        line: 'protected-mode no'
        backup: yes

    - name: Restart Redis to apply config changes
      ansible.builtin.systemd:
        name: redis
        state: restarted

