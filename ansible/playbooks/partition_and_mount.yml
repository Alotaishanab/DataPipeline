- name: Partition /dev/vdb and mount at /data on workers
  hosts: worker_inventory
  become: yes 
  gather_facts: yes

  vars:
    device_to_mount: "/dev/vdb"
    mount_point: "/data"

  tasks:
    - name: Check if /data is already mounted
      shell: "mountpoint -q {{ mount_point }}"
      register: mountpoint_result
      changed_when: false
      failed_when: false

    - name: Partition /dev/vdb
      community.general.parted:
        device: "{{ device_to_mount }}"
        number: 1
        state: present
        part_type: primary
        fs_type: xfs
        part_start: "0%"
        part_end: "100%"

    - name: Create XFS filesystem
      community.general.filesystem:
        dev: "{{ device_to_mount }}1"
        fstype: xfs
        force: yes
      when: mountpoint_result.rc != 0

    - name: Create /data directory
      file:
        path: "{{ mount_point }}"
        state: directory
        mode: '0755'

    - name: Mount /dev/vdb1 on /data
      mount:
        path: "{{ mount_point }}"
        src: "{{ device_to_mount }}1"
        fstype: xfs
        state: mounted

    - name: Create results and datasets subdirectories on /data
      file:
        path: "/data/{{ item }}"
        state: directory
        owner: nobody
        group: nobody
        mode: '0777'
      loop:
        - datasets
        - results